<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>QubeQuote — คลิปอธิบาย 4 ขั้นตอน</title>
<!-- FONTS -->
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; max-width: 96vw; max-height: 90vh; margin: 20px auto; }
  #log { color: #ccc; font: 13px monospace; white-space: pre; margin: 0 20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.min.js"></script>
<script src="/tools/clip/lib.js"></script>
<script>
/* ============================================================================
 * QubeQuote explainer, ~34 seconds, drawn frame by frame on a canvas.
 *
 * Three framings from one drawing: 1080x1920 (Reels/TikTok/LINE), 1920x1080
 * (YouTube) and 1080x1080 (Facebook feed). The step scenes are a header and
 * a "body" — the phone, the cards — and the body is drawn once in its own
 * 860-wide coordinate system, then placed and scaled per framing: under the
 * header in portrait, beside it in the other two. The hook and the outro are
 * centred compositions and take their positions from the frame.
 *
 * Everything is a pure function of time — draw(t) — so a frame can be looked
 * at, re-rendered, or encoded without the animation having to run at real
 * speed. The framing, the drawing kit, the music and the encoder live in
 * lib.js, shared with the other clips; this file is only the story.
 *
 * ?w=1920&h=1080 picks the framing. ?play=1 loops it; ?t=12.5 freezes a frame.
 * ========================================================================== */
'use strict';

/* ---- copy. Every name here is invented; no real account appears. ---- */
const ITEM = 'เครื่องดูดเศษวัสดุในเครื่อง CNC';
const SELLERS = [
  { name: 'บจก. เอ-พลัส แมชชีน', price: 48500, days: 5,  stars: 4.8 },
  { name: 'ร้านช่างโต อุตสาหกรรม', price: 42000, days: 7,  stars: 4.6 },
  { name: 'บจก. ซี.เอ็น.ซี. โปร',  price: 45900, days: 4,  stars: 4.9 }
];
const LOWEST = 1;

/* ---- timeline (seconds) ---- */
const T = {
  hook: [0, 4.6],
  s1:   [4.6, 11.4],
  s2:   [11.4, 18.4],
  s3:   [18.4, 25.4],
  s4:   [25.4, 29.6],
  outro:[29.6, 34.0]
};
const DURATION = T.outro[1];

/* ====================== SCENES ====================== */

function sceneHook(t) {
  const [a, b] = T.hook;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .5);
  topBrand(true);
  const u0 = seg(t, a + .1, a + .8, outBack);
  const l1 = seg(t, a + .5, a + 1.1), l2 = seg(t, a + .85, a + 1.45), l3 = seg(t, a + 1.7, a + 2.3), l4 = seg(t, a + 2.2, a + 3.0);
  // positions per framing
  let P;
  if (F.kind === 'portrait')       P = { bx: W / 2, by: 620, br: 150, bpx: 200, tx: W / 2, y1: 960, y2: 1090, ty: 1230, dy: 1400, px: 92, tpx: 44, align: 'center' };
  else if (F.kind === 'square')    P = { bx: W / 2, by: 250, br: 110, bpx: 150, tx: W / 2, y1: 520, y2: 630, ty: 740, dy: 880, px: 80, tpx: 38, align: 'center' };
  else                             P = { bx: 640, by: H / 2, br: 170, bpx: 230, tx: 950, y1: H / 2 - 70, y2: H / 2 + 50, ty: H / 2 + 160, dy: H / 2 + 300, px: 92, tpx: 42, align: 'left' };
  const bob = Math.sin(t * 2.2) * 12;
  ctx.save(); ctx.translate(P.bx, P.by + bob); ctx.scale(u0, u0);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, P.br, 0, Math.PI * 2); ctx.fill();
  text('?', 0, P.br * .08, { w: 700, px: P.bpx, color: BLUE, align: 'center', base: 'middle' });
  ctx.restore();
  text('มีของที่ต้องการซื้อ', P.tx, P.y1 + lerp(40, 0, l1), { w: 700, px: P.px, color: '#fff', align: P.align, alpha: l1 });
  text('แต่ไม่รู้ราคาตลาด?', P.tx, P.y2 + lerp(40, 0, l2), { w: 700, px: P.px, color: '#fff', align: P.align, alpha: l2 });
  text('ให้ผู้ขายเสนอราคามาหาคุณ ใน 4 ขั้นตอน', P.tx, P.ty, { w: 500, px: P.tpx, color: 'rgba(255,255,255,.85)', align: P.align, alpha: l3 });
  const dx0 = P.align === 'center' ? P.tx : P.tx + 3 * 75 + 54;
  for (let i = 0; i < 4; i++) {
    const uu = seg(t, a + 2.2 + i * .15, a + 2.7 + i * .15, outBack);
    const x = dx0 + (i - 1.5) * 150, y = P.dy;
    ctx.save(); ctx.globalAlpha *= clamp(uu, 0, 1); ctx.translate(x, y); ctx.scale(uu, uu);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(0, 0, 54, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    text(String(i + 1), 0, 2, { w: 700, px: 46, color: '#fff', align: 'center', base: 'middle' });
    ctx.restore();
    if (i < 3) { ctx.save(); ctx.globalAlpha *= l4 * .6; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 62, y); ctx.lineTo(x + 88, y); ctx.stroke(); ctx.restore(); }
  }
  ctx.restore();
}

function scene1(t) {
  const [a, b] = T.s1;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(1, 'ลงรายการ|ที่ต้องการซื้อ', 'บอกสิ่งที่ต้องการ ใส่จังหวัด แนบรูป แล้วโพสต์', t, a + .1);
  const pu = seg(t, a + .3, a + 1.0);
  body(() => {
    ctx.globalAlpha *= pu;
    const box = phone(30, 30 + lerp(120, 0, pu), 800, 1180);
    const fx = box.x + 40, fy = box.y + 50, fw = box.w - 80;
    text('โพสต์ประกาศ', fx, fy + 30, { w: 700, px: 44 });
    text('บอกสิ่งที่ต้องการ แล้วให้ผู้ขายเสนอราคามาหาคุณ', fx, fy + 86, { w: 400, px: 27, color: INK_SOFT });
    text('หัวข้อ', fx, fy + 170, { w: 600, px: 28 });
    ctx.fillStyle = '#fff'; ctx.strokeStyle = t < a + 4.6 ? BLUE : LINE; ctx.lineWidth = 3; rr(fx, fy + 190, fw, 92, 18); ctx.fill(); ctx.stroke();
    const tu = seg(t, a + 1.3, a + 3.6, u => clamp(u, 0, 1));
    const shown = ITEM.slice(0, Math.round(ITEM.length * tu));
    text(shown, fx + 28, fy + 248, { w: 500, px: 34 });
    if (t < a + 4.6 && Math.floor(t * 2.5) % 2 === 0) { const cw = measure(shown, 500, 34); ctx.fillStyle = BLUE; ctx.fillRect(fx + 30 + cw, fy + 214, 3, 50); }
    const cu = seg(t, a + 3.7, a + 4.3);
    ctx.save(); ctx.globalAlpha *= cu;
    text('จังหวัดของงาน', fx, fy + 350, { w: 600, px: 28 });
    ctx.fillStyle = '#fff'; ctx.strokeStyle = LINE; rr(fx, fy + 370, fw, 84, 18); ctx.fill(); ctx.stroke();
    text('📍 เชียงใหม่', fx + 28, fy + 424, { w: 500, px: 32 });
    ctx.restore();
    const iu = seg(t, a + 4.2, a + 4.9, outBack);
    text('รูปประกอบ', fx, fy + 530, { w: 600, px: 28, alpha: iu });
    for (let i = 0; i < 3; i++) {
      const uu = seg(t, a + 4.2 + i * .12, a + 4.8 + i * .12, outBack);
      const tx = fx + i * (fw / 3), tw = fw / 3 - 16;
      ctx.save(); ctx.globalAlpha *= clamp(uu, 0, 1); ctx.translate(tx + tw / 2, fy + 640); ctx.scale(uu, uu);
      ctx.fillStyle = i === 0 ? BLUE_SOFT : '#f1f3f8'; rr(-tw / 2, -90, tw, 180, 20); ctx.fill();
      ctx.strokeStyle = i === 0 ? BLUE : LINE; ctx.lineWidth = 3; ctx.setLineDash(i === 0 ? [] : [12, 10]); rr(-tw / 2, -90, tw, 180, 20); ctx.stroke();
      if (i === 0) { ctx.fillStyle = BLUE; ctx.beginPath(); ctx.moveTo(-60, 50); ctx.lineTo(-20, -10); ctx.lineTo(10, 25); ctx.lineTo(35, 0); ctx.lineTo(70, 50); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(40, -35, 14, 0, Math.PI * 2); ctx.fill(); }
      else text('+', 0, 4, { w: 400, px: 70, color: '#aeb6c8', align: 'center', base: 'middle' });
      ctx.restore();
    }
    const bu = seg(t, a + 4.9, a + 5.4);
    const press = t > a + 5.9 && t < a + 6.2 ? 1 - Math.abs((t - a - 6.05) / .15) : 0;
    ctx.save(); ctx.globalAlpha *= bu; ctx.translate(fx + fw / 2, fy + 860); ctx.scale(1 - press * .06, 1 - press * .06);
    ctx.fillStyle = press ? BLUE_DEEP : BLUE; rr(-fw / 2, -50, fw, 100, 50); ctx.fill();
    text('＋ โพสต์ประกาศ', 0, 3, { w: 700, px: 36, color: '#fff', align: 'center', base: 'middle' });
    ctx.restore();
    const ku = seg(t, a + 6.2, a + 6.6, outBack);
    if (ku > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(ku, 0, 1); ctx.translate(fx + fw / 2, fy + 990); ctx.scale(ku, ku);
      ctx.fillStyle = GREEN_SOFT; rr(-200, -40, 400, 80, 40); ctx.fill();
      text('✓ โพสต์ประกาศแล้ว', 0, 3, { w: 600, px: 30, color: GREEN, align: 'center', base: 'middle' });
      ctx.restore();
    }
  });
  dots(0);
  ctx.restore();
}

function scene2(t) {
  const [a, b] = T.s2;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(2, 'รอผู้ขาย|เสนอราคา', 'ผู้ขายในสายงานนี้เห็นประกาศของคุณ และส่งข้อเสนอเข้ามาเอง', t, a + .1);
  body(() => {
    const cu = seg(t, a + .3, a + .9);
    const cx = 0, cy = 0 + lerp(60, 0, cu), cw = BODY_W;
    ctx.save(); ctx.globalAlpha *= cu;
    card(cx, cy, cw, 300, 28);
    ctx.fillStyle = BLUE_SOFT; ctx.beginPath(); ctx.arc(cx + 70, cy + 70, 34, 0, Math.PI * 2); ctx.fill();
    text('คุณ', cx + 70, cy + 73, { w: 700, px: 24, color: BLUE, align: 'center', base: 'middle' });
    text('ประกาศของคุณ', cx + 124, cy + 62, { w: 700, px: 30 });
    text('เชียงใหม่ · เพิ่งโพสต์', cx + 124, cy + 100, { w: 400, px: 26, color: INK_SOFT });
    pill('ต้องการซื้อ', cx + cw - 34, cy + 40, { align: 'right', px: 24, bg: BLUE, color: '#fff' });
    text(ITEM, cx + 34, cy + 175, { w: 600, px: 38 });
    const n = Math.min(3, Math.max(0, Math.floor((t - a - 1.6) / 1.5) + 1));
    const bump = (() => { const k = (t - a - 1.6) % 1.5; return k > 0 && k < .3 ? 1 - k / .3 : 0; })();
    ctx.save(); ctx.translate(cx + 34, cy + 220); ctx.scale(1 + bump * .08, 1 + bump * .08);
    pill('ข้อเสนอ ' + n, 0, 0, { px: 28, bg: n ? BLUE_SOFT : '#f1f3f8', color: n ? BLUE : INK_SOFT });
    ctx.restore();
    ctx.restore();
    const wu = fadeInOut(t, a + .8, a + 2.2, .3);
    if (wu > 0) {
      const dotN = Math.floor(t * 3) % 4;
      text('กำลังรอข้อเสนอ' + '.'.repeat(dotN), BODY_W / 2, 420, { w: 500, px: 34, color: INK_SOFT, align: 'center', alpha: wu });
    }
    for (let i = 0; i < 3; i++) {
      const s0 = a + 1.6 + i * 1.5;
      const u = seg(t, s0, s0 + .6, outBack);
      if (u <= 0) continue;
      const y = 440 + i * 205;
      const x = lerp(BODY_W + 300, 0, clamp(u, 0, 1));
      ctx.save(); ctx.globalAlpha *= clamp(u, 0, 1);
      card(x, y, BODY_W, 150, 26);
      ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(x + 72, y + 75, 38, 0, Math.PI * 2); ctx.fill();
      text('🔔', x + 72, y + 79, { px: 36, align: 'center', base: 'middle' });
      text(SELLERS[i].name, x + 134, y + 62, { w: 700, px: 32 });
      text('ส่งข้อเสนอราคามาแล้ว', x + 134, y + 108, { w: 400, px: 28, color: INK_SOFT });
      text('เมื่อสักครู่', x + BODY_W - 34, y + 62, { w: 400, px: 24, color: INK_SOFT, align: 'right' });
      ctx.restore();
    }
    const su = seg(t, a + 5.2, a + 5.8);
    if (su > 0) pill('🔒 ราคาปิดผนึก — ผู้ขายมองไม่เห็นราคากันเอง', BODY_W / 2, 1100, { align: 'center', px: 28, bg: '#fff', color: INK_SOFT, border: LINE, alpha: su });
  });
  dots(1);
  ctx.restore();
}

function scene3(t) {
  const [a, b] = T.s3;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(3, 'เปรียบเทียบ|ข้อเสนอ', 'เห็นราคาและเงื่อนไขของทุกรายในหน้าเดียว', t, a + .1);
  body(() => {
    const rowH = 250, gap = 26, top = 40;
    const hl = seg(t, a + 3.2, a + 3.8);
    for (let i = 0; i < 3; i++) {
      const u = seg(t, a + .5 + i * .35, a + 1.1 + i * .35);
      if (u <= 0) continue;
      const y = top + i * (rowH + gap) + lerp(40, 0, u);
      const pu = seg(t, a + 1.2 + i * .35, a + 2.2 + i * .35, inOutCubic);
      ctx.save(); ctx.globalAlpha *= u;
      offerRow(SELLERS[i], 0, y, BODY_W, i, Math.round(SELLERS[i].price * pu / 100) * 100, i === LOWEST, hl);
      ctx.restore();
    }
    const du = seg(t, a + 4.2, a + 4.8, outBack);
    if (du > 0) {
      const diff = SELLERS[0].price - SELLERS[LOWEST].price;
      ctx.save(); ctx.globalAlpha *= clamp(du, 0, 1); ctx.translate(BODY_W / 2, 980); ctx.scale(du, du);
      ctx.fillStyle = BLUE; rr(-400, -70, 800, 140, 36); ctx.fill();
      text('ต่างกันถึง ' + baht(diff) + ' ในงานเดียวกัน', 0, 4, { w: 700, px: 36, color: '#fff', align: 'center', base: 'middle' });
      ctx.restore();
    }
  });
  dots(2);
  ctx.restore();
}

function scene4(t) {
  const [a, b] = T.s4;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(4, 'ค่อยตัดสินใจ', 'ไม่ต้องรีบ — ดูข้อเสนอทั้งหมดก่อน แล้วค่อยเลือกรายที่ใช่', t, a + .1);
  body(() => {
    const u = seg(t, a + .3, a + .9);
    const s = SELLERS[LOWEST];
    const y = 120 + lerp(40, 0, u), h = 250;
    ctx.save(); ctx.globalAlpha *= u;
    offerRow(s, 0, y, BODY_W, LOWEST, s.price, true, 1);
    ctx.restore();
    const bu = seg(t, a + .8, a + 1.2);
    const press = t > a + 1.6 && t < a + 1.9 ? 1 - Math.abs((t - a - 1.75) / .15) : 0;
    const done = t > a + 1.9;
    ctx.save(); ctx.globalAlpha *= bu; ctx.translate(BODY_W / 2, y + h + 110); ctx.scale(1 - press * .06, 1 - press * .06);
    ctx.fillStyle = done ? GREEN : BLUE; rr(-330, -54, 660, 108, 54); ctx.fill();
    text(done ? '✓ เลือกข้อเสนอนี้แล้ว' : 'เลือกข้อเสนอนี้', 0, 4, { w: 700, px: 38, color: '#fff', align: 'center', base: 'middle' });
    ctx.restore();
    const ku = seg(t, a + 1.9, a + 3.0, u => clamp(u, 0, 1));
    if (ku > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(ku * 2, 0, 1);
      ctx.fillStyle = GREEN_SOFT; ctx.beginPath(); ctx.arc(BODY_W / 2, 820, 150, 0, Math.PI * 2); ctx.fill();
      check(BODY_W / 2, 820, 105, ku, GREEN, 16);
      ctx.restore();
    }
    const mu = seg(t, a + 2.6, a + 3.2);
    text('เลือกเมื่อพร้อม', BODY_W / 2, 1080, { w: 700, px: 46, align: 'center', alpha: mu });
  });
  dots(3);
  ctx.restore();
}

function sceneOutro(t) {
  const [a, b] = T.outro;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = Math.min(seg(t, a, a + .5), 1 - seg(t, b - .6, b, u => clamp(u, 0, 1)));
  let P;
  if (F.kind === 'portrait')    P = { my: 760, mh: 260, wy: 1010, wpx: 120, sy: 1150, spx: 58, py: 1290, ppx: 44, ny: 1470, npx: 32 };
  else if (F.kind === 'square') P = { my: 300, mh: 200, wy: 500, wpx: 104, sy: 615, spx: 50, py: 720, ppx: 40, ny: 870, npx: 30 };
  else                          P = { my: 270, mh: 220, wy: 500, wpx: 120, sy: 640, spx: 58, py: 760, ppx: 44, ny: 930, npx: 32 };
  const u = seg(t, a + .1, a + .9, outBack);
  ctx.save(); ctx.translate(W / 2, P.my); ctx.scale(u, u);
  const im = IMG.markWhite; const mw = P.mh * im.width / im.height;
  ctx.drawImage(im, -mw / 2, -P.mh / 2, mw, P.mh);
  ctx.restore();
  const wu = seg(t, a + .6, a + 1.2);
  ctx.save(); ctx.globalAlpha *= wu;
  wordmark(W / 2 - wordmarkWidth(P.wpx) / 2, P.wy, P.wpx, true);
  ctx.restore();
  const su = seg(t, a + 1.1, a + 1.7);
  text('ให้ผู้ขายเสนอราคามาหาคุณ', W / 2, P.sy + lerp(30, 0, su), { w: 600, px: P.spx, color: '#fff', align: 'center', alpha: su });
  pill('qubequote.com', W / 2, P.py, { align: 'center', px: P.ppx, padX: 48, bg: '#fff', color: BLUE, alpha: seg(t, a + 1.7, a + 2.3) });
  text('ดูประกาศได้ทันที · สมัครฟรีเมื่อพร้อมเสนอราคา', W / 2, P.ny, { w: 400, px: P.npx, color: 'rgba(255,255,255,.85)', align: 'center', alpha: seg(t, a + 2.2, a + 2.8) });
  ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  if (t < T.hook[1]) sceneHook(t);
  else if (t < T.s1[1]) scene1(t);
  else if (t < T.s2[1]) scene2(t);
  else if (t < T.s3[1]) scene3(t);
  else if (t < T.s4[1]) scene4(t);
  else sceneOutro(Math.min(t, DURATION - 1e-3));
}

boot();
</script>
</body>
</html>
