<!doctype html>

<meta charset="utf-8">
<title>QubeQuote — QubeQuote คืออะไร</title>
<!-- FONTS -->

  canvas { display: block; max-width: 96vw; max-height: 90vh; margin: 20px auto; }

<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.min.js"></script>
<script src="/tools/clip/lib.js"></script>
<script>
/* ============================================================================
 * "QubeQuote คืออะไร" — the introduction, ~30 seconds, drawn frame by frame.
 *
 * The other clips are for people who already know the site and want to see
 * a page. This one is for people who have never heard of it: the old way
 * (ring every supplier, one at a time), the idea (post what you need, the
 * sellers come to you), what each side gets, why it is easy, and the site's
 * own tagline. No phone screens — a diagram and cards, in the brand colours.
 *
 * Everything is a pure function of time; framing, drawing kit, music and
 * encoder come from lib.js.
 * ?w=1920&h=1080 picks the framing. ?play=1 loops it; ?t=12.5 freezes a frame.
 * ========================================================================== */
'use strict';

/* ---- copy. Every name here is invented; no real account appears. ---- */
const ITEM = 'ชั้นวางสินค้าเหล็ก 20 ชุด';
const SELLERS = [
  { name: 'บจก. สยาม สตีล แร็ค',    price: '฿39,800', bg: '#dbe7ff' },
  { name: 'ร้านช่างเหล็กบางนา',     price: '฿36,500', bg: '#e6f6ea' },
  { name: 'บจก. ทีเค เมทัล ซัพพลาย', price: '฿41,200', bg: '#fff1d6' }
];
// [icon name from lib.js ICONS, title, one line under it]
const HOW_POINTS = [
  ['doc',    'โพสต์ความต้องการ ฟรี',            'หน่วยงานรัฐ บริษัทเอกชน หรือบุคคลทั่วไป'],
  ['chart',  'เห็นทุกราคาในหน้าเดียว',           'ราคา เงื่อนไข เอกสารแนบ ของทุกรายเทียบกันได้'],
  ['shield', 'เป็นกลาง โปร่งใส ตรวจสอบได้',      'ผู้ขายหลายรายเสนอมาโดยอิสระ ย้อนดูได้ทุกเมื่อ']
];
const BUYER_POINTS = [
  ['doc',     'โพสต์ความต้องการ ฟรี',            'บอกว่าต้องการอะไร ที่ไหน งบเท่าไร แล้วรอ'],
  ['chart',   'เปรียบเทียบทุกข้อเสนอในหน้าเดียว', 'ราคา เงื่อนไข เอกสารแนบ ของทุกรายอยู่ที่เดียว'],
  ['check',   'ตัดสินใจเองเมื่อพร้อม',           'ไม่มีใครเร่ง ดูให้ครบแล้วค่อยเลือก']
];
const SELLER_POINTS = [
  ['search',  'เจอลูกค้าที่ต้องการของคุณจริง ๆ',  'ผู้ซื้อโพสต์ความต้องการไว้แล้ว แค่เลือกงานที่ทำได้'],
  ['pen',     'เสนอราคาพร้อมแนบเอกสาร',          'ใบเสนอราคา แคตตาล็อก ตัวอย่างงาน ส่งไปด้วยกันได้'],
  ['lock',    'ราคาปิดผนึก',                     'ผู้ขายรายอื่นมองไม่เห็นราคาของคุณ']
];
const TRUST_POINTS = [
  ['balance',   'ราคาที่เป็นกลาง',   'มาจากผู้ขายหลายรายที่เสนอมาโดยอิสระ — ไม่มีใครชี้นำ QubeQuote ไม่ใช่ผู้ขาย'],
  ['eye',       'ราคาที่โปร่งใส',    'เห็นทุกราคา พร้อมเงื่อนไขและเอกสารแนบ เทียบกันได้ตรง ๆ'],
  ['clipboard', 'ราคาที่ตรวจสอบได้', 'ทุกข้อเสนอและเอกสารเก็บไว้ในระบบ ย้อนดูและใช้อ้างอิงได้ทุกเมื่อ']
];

/* ---- timeline (seconds) ----
   These are the scene lengths without narration. With it, applyVoice()
   below stretches any scene whose line runs longer, so the voice never
   spills into the next picture; the lengths here are the minimums. */
const BASE = { hook: 6.0, s1: 6.0, s2: 7.8, outro: 5.0 };
const ORDER = ['hook', 's1', 's2', 'outro'];

/* ---- the real site: marketing/shots/*.png from node tools/build-shots.js ----
   Loaded before the first frame; if they are missing the scene is skipped
   and the clip says so in its log. */
let SHOTS = null;
async function prepare() {
  try {
    const names = ['feed', 'detail', 'compose', 'compare', 'mybids'];
    await Promise.all(names.map(n => loadImg('shot_' + n, '/marketing/shots/' + n + '.png')));
    SHOTS = {}; names.forEach(n => { SHOTS[n] = IMG['shot_' + n]; });
  } catch (e) { log('ไม่มีภาพหน้าเว็บ (marketing/shots) — ข้ามฉากหน้าเว็บจริง; รัน node tools/build-shots.js ก่อน'); }
}
let T = {}, DURATION = 0;
(function lay() { let t = 0; for (const k of ORDER) { T[k] = [t, t + BASE[k]]; t += BASE[k]; } DURATION = t; })();

/* ---- narration: tools/clip/intro.voice.json → node tools/build-voice.js intro ---- */
const VOICE_MANIFEST = '/marketing/voice/intro/manifest.json';
const VOICE_SPEED = 1.35;      // the narrator reads slowly; a fifth faster is a natural pace
const LINE_OF = { hook: 'hook', s1: 'idea', s2: 'how', outro: 'outro' };
function applyVoice(m) {
  const LEAD = .3, TAIL = .4;     // a beat of picture before the voice starts, and after it stops
  let t = 0;
  for (const k of ORDER) {
    const ln = m && m.lines.find(l => l.id === LINE_OF[k]);
    const len = Math.max(BASE[k], ln ? LEAD + ln.duration + TAIL : 0);
    T[k] = [t, t + len];
    if (ln) ln.at = t + LEAD;
    t += len;
  }
  DURATION = t;
}

/* ---- clip-specific helpers ---- */
function avatar(x, y, r, initial, bg, color) {
  ctx.fillStyle = bg || BLUE; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  text(initial, x, y + 2, { w: 700, px: r * .9, color: color || '#fff', align: 'center', base: 'middle' });
}
/* A benefit card: big emoji, a title, one line under it. */
function pointCard(p, x, y, w, u) {
  ctx.save(); ctx.globalAlpha *= clamp(u, 0, 1);
  ctx.translate(lerp(60, 0, clamp(u, 0, 1)), 0);
  card(x, y, w, 330, 28);
  ctx.fillStyle = BLUE_SOFT; rr(x + 34, y + 75, 180, 180, 40); ctx.fill();
  icon(p[0], x + 124, y + 165, 108, BLUE, 8);
  text(p[1], x + 250, y + 132, { w: 700, px: 44 });
  const lines = wrapText(p[2], 400, 32, w - 284);
  lines.forEach((ln, i) => text(ln, x + 250, y + 192 + i * 46, { w: 400, px: 32, color: INK_SOFT }));
  ctx.restore();
}
/* Three points in a compact stack, the phone under them showing the page each
   one is about; the point being shown is outlined. Beats are thirds of the
   scene, so a scene stretched for its narration keeps the same shape. */
function pointsWithPhone(points, beats, t, a, b) {
  const L = b - a, u = clamp((t - a) / L, 0, 1);
  const n = beats.length, beat = Math.min(n - 1, Math.floor(u * n)), bu = u * n - beat;
  const lit = beats[beat].card == null ? beat : beats[beat].card;
  body(() => {
    points.forEach((p, i) => {
      const cu = seg(t, a + .3 + i * .25, a + .8 + i * .25);
      if (cu <= 0) return;
      const y = 10 + i * 180;
      ctx.save(); ctx.globalAlpha *= cu; ctx.translate(lerp(40, 0, cu), 0);
      card(0, y, BODY_W, 166, 24);
      if (i === lit) { ctx.strokeStyle = BLUE; ctx.lineWidth = 5; rr(0, y, BODY_W, 166, 24); ctx.stroke(); }
      ctx.fillStyle = BLUE_SOFT; rr(24, y + 30, 106, 106, 26); ctx.fill();
      icon(p[0], 77, y + 83, 66, BLUE, 8);
      text(p[1], 156, y + 70, { w: 700, px: 35 });
      text(p[2], 156, y + 122, { w: 400, px: 27, color: INK_SOFT });
      ctx.restore();
    });
    const pu = seg(t, a + .3, a + 1.0);
    ctx.save(); ctx.globalAlpha *= pu;
    ctx.translate((BODY_W - 800 * .6) / 2, 566 + lerp(80, 0, pu)); ctx.scale(.6, .6);
    const box = phone(0, 0, 800, 1180, { blank: true });
    // the previous page fades out under the new one
    const cur = beats[beat], prev = beats[beat - 1];
    if (prev && bu < .15) screen(SHOTS[prev.img], box, prev.to, 1);
    const slide = beat > 0 ? lerp(box.w, 0, outCubic(clamp(bu * 4, 0, 1))) : 0;
    ctx.save(); ctx.translate(slide, 0);
    screen(SHOTS[cur.img], box, lerp(cur.from, cur.to, inOutCubic(clamp((bu - .2) / .7, 0, 1))), 1);
    ctx.restore();
    ctx.restore();
  });
}
function pointList(points, t, a) {
  body(() => {
    points.forEach((p, i) => pointCard(p, 0, 60 + i * 380, BODY_W, seg(t, a + .4 + i * .45, a + 1.0 + i * .45)));
  });
}
/* The old ways, drawn with strokes so they can shake and be crossed out:
   a call, an e-mail, a LINE message, and not knowing where to look at all. */
function oldWay(kind, x, y, s, wobble, crossed) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(wobble); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'phone') {
    ctx.beginPath(); ctx.moveTo(-42, -40); ctx.quadraticCurveTo(-52, 30, 10, 48); ctx.quadraticCurveTo(40, 52, 46, 38);
    ctx.lineTo(30, 12); ctx.lineTo(10, 22); ctx.quadraticCurveTo(-20, 4, -16, -26); ctx.lineTo(-6, -36); ctx.lineTo(-24, -58); ctx.closePath(); ctx.stroke();
  } else if (kind === 'mail') {
    rr(-56, -38, 112, 76, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-50, -30); ctx.lineTo(0, 8); ctx.lineTo(50, -30); ctx.stroke();
  } else if (kind === 'line') {
    ctx.beginPath(); ctx.moveTo(-40, -44); ctx.lineTo(40, -44); ctx.quadraticCurveTo(60, -44, 60, -24); ctx.lineTo(60, 14); ctx.quadraticCurveTo(60, 34, 40, 34);
    ctx.lineTo(-10, 34); ctx.lineTo(-38, 56); ctx.lineTo(-34, 34); ctx.quadraticCurveTo(-60, 34, -60, 14); ctx.lineTo(-60, -24); ctx.quadraticCurveTo(-60, -44, -40, -44); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = font(700, 30); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('LINE', 0, -6);
  } else {
    ctx.beginPath(); ctx.arc(-10, -10, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, 22); ctx.lineTo(56, 56); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = font(700, 54); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', -10, -8);
  }
  if (crossed > 0) {
    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 16;
    const k1 = clamp(crossed * 2, 0, 1), k2 = clamp(crossed * 2 - 1, 0, 1);
    ctx.beginPath(); ctx.moveTo(-70, -70); ctx.lineTo(lerp(-70, 70, k1), lerp(-70, 70, k1)); ctx.stroke();
    if (k2 > 0) { ctx.beginPath(); ctx.moveTo(70, -70); ctx.lineTo(lerp(70, -70, k2), lerp(-70, 70, k2)); ctx.stroke(); }
  }
  ctx.restore();
}

/* ====================== SCENES ====================== */

/* The old way: three suppliers, three calls, still no comparison. */
/* Both sides of the market, side by side: the buyer who cannot tell whether
   the one price they were given is a fair one, and the seller who cannot find
   the customers who want exactly what they sell. */
function sceneHook(t) {
  const [a, b] = T.hook;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .5);
  topBrand(true);
  let P;
  if (F.kind === 'portrait')    P = { cy: 960, ir: 150, chip: 40, px: 48, spx: 32, cw: 480, gap: 40, top: 360, foot: 1470 };
  else if (F.kind === 'square') P = { cy: 640, ir: 120, chip: 32, px: 40, spx: 26, cw: 450, gap: 36, top: 270, foot: 990 };
  else                          P = { cy: H / 2 + 60, ir: 120, chip: 32, px: 40, spx: 26, cw: 520, gap: 60, top: 230, foot: H - 110 };
  const SIDES = [
    { chip: 'ผู้ซื้อ', icon: 'cartq',  head: 'ประกาศสิ่งที่ต้องการ', head2: 'รับข้อเสนอจากผู้ขาย' },
    { chip: 'ผู้ขาย', icon: 'target', head: 'พบความต้องการซื้อ',   head2: 'เสนอสินค้าให้ลูกค้า' }
  ];
  SIDES.forEach((side, i) => {
    const u = seg(t, a + .2 + i * .35, a + .9 + i * .35, outBack);
    if (u <= 0) return;
    const x = W / 2 + (i - .5) * (P.cw + P.gap);
    /* The panel is drawn around its contents rather than the contents fitted
       into a fixed box: chip, icon, headline, one line under it — measured
       first, so nothing can spill past the rounded edge in any framing. */
    const inner = P.cw - 56;
    const head = wrapText(side.head, 700, P.px, inner);
    const head2 = wrapText(side.head2, 700, P.px, inner);
    const chipH = P.chip * 1.75;
    const H1 = P.px * 1.22;
    const ARROW = P.px * 1.5;
    const contentH = chipH + 26 + P.ir + 30 + head.length * H1 + ARROW + head2.length * H1;
    const ch = contentH + 56;
    ctx.save();
    ctx.globalAlpha *= clamp(u, 0, 1);
    ctx.translate(x, P.cy + lerp(50, 0, clamp(u, 0, 1)));
    ctx.fillStyle = 'rgba(255,255,255,.10)'; rr(-P.cw / 2, -ch / 2, P.cw, ch, 40); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 3; rr(-P.cw / 2, -ch / 2, P.cw, ch, 40); ctx.stroke();
    let y = -ch / 2 + 28;
    pill(side.chip, 0, y, { align: 'center', px: P.chip, h: chipH, padX: 34, bg: '#fff', color: BLUE });
    y += chipH + 26;
    icon(side.icon, 0, y + P.ir / 2, P.ir, '#fff', 9);
    y += P.ir + 30 + P.px * .85;
    head.forEach((ln, k) => text(ln, 0, y + H1 * k, { w: 700, px: P.px, color: '#fff', align: 'center' }));
    y += H1 * (head.length - 1) + ARROW * .62;
    // a down arrow: what the action gives back
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, y - P.px * .5); ctx.lineTo(0, y + P.px * .3);
    ctx.moveTo(-13, y + P.px * .1); ctx.lineTo(0, y + P.px * .3); ctx.lineTo(13, y + P.px * .1); ctx.stroke(); ctx.restore();
    y += ARROW * .38 + P.px * .85;
    head2.forEach((ln, k) => text(ln, 0, y + H1 * k, { w: 700, px: P.px, color: '#fff', align: 'center' }));
    ctx.restore();
  });
  const tu = seg(t, a + .15, a + .75), fu = seg(t, a + 1.5, a + 2.1);
  wrapText('อยากซื้ออะไร? ให้ผู้ขายเข้ามาเสนอราคา', 700, P.px * 1.2, W - 120)
    .forEach((ln, i) => text(ln, W / 2, P.top + i * P.px * 1.5, { w: 700, px: P.px * 1.2, color: '#fff', align: 'center', alpha: tu }));
  text('ซื้ออย่างมีข้อมูล • ขายได้ตรงความต้องการ', W / 2, P.foot, { w: 600, px: P.spx * 1.25, color: 'rgba(255,255,255,.9)', align: 'center', alpha: fu });
  ctx.restore();
}

/* The idea, as a picture: one post at the top, offers coming up to it. */
function scene1(t) {
  const [a, b] = T.s1;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('icon:bulb', 'QubeQuote| คืออะไร', 'แพลตฟอร์มขอราคา และเปรียบเทียบราคา', t, a + .1);
  const L = b - a;
  body(() => {
    // the buyer's post
    const pu = seg(t, a + .3, a + .8, outBack);
    ctx.save(); ctx.globalAlpha *= clamp(pu, 0, 1);
    const px = 90, py = 40 + lerp(-60, 0, clamp(pu, 0, 1)), pw = BODY_W - 180;
    card(px, py, pw, 230, 28);
    avatar(px + 64, py + 64, 32, 'คุณ', BLUE_SOFT, BLUE);
    text('ผู้ซื้อ', px + 112, py + 58, { w: 700, px: 28 });
    text('โพสต์สิ่งที่ต้องการ', px + 112, py + 92, { w: 400, px: 24, color: INK_SOFT });
    pill('ต้องการซื้อ', px + pw - 30, py + 40, { align: 'right', px: 22, h: 40, padX: 16, bg: BLUE, color: '#fff' });
    text(ITEM, px + 30, py + 160, { w: 700, px: 34 });
    text('📍 ชลบุรี · 💰 งบ ฿40,000', px + 30, py + 202, { w: 400, px: 24, color: INK_SOFT });
    ctx.restore();
    // sellers below, each sending an offer up
    const sy = 1120;
    SELLERS.forEach((s, i) => {
      const sx = 150 + i * 280;
      const su = seg(t, a + .8 + i * .15, a + 1.2 + i * .15, outBack);
      if (su <= 0) return;
      ctx.save(); ctx.globalAlpha *= clamp(su, 0, 1); ctx.translate(sx, sy); ctx.scale(su, su);
      avatar(0, 0, 54, s.name.replace(/^(บจก\. |ร้าน)/, '').charAt(0), s.bg, INK);
      ctx.restore();
      wrapText(s.name, 500, 22, 260).forEach((ln, k) => text(ln, sx, sy + 90 + k * 28, { w: 500, px: 22, color: INK_SOFT, align: 'center', alpha: su }));
      // the offer travels up the dashed line to sit under the post
      const ou = seg(t, a + L * (.3 + i * .12), a + L * (.3 + i * .12) + .8, inOutCubic);
      if (ou <= 0) return;
      ctx.save(); ctx.strokeStyle = '#c9d3ea'; ctx.lineWidth = 3; ctx.setLineDash([12, 12]);
      ctx.beginPath(); ctx.moveTo(sx, sy - 60); ctx.lineTo(sx, 300 + i * 0 + 240); ctx.stroke(); ctx.restore();
      const ty = 320 + i * 118;
      const oy = lerp(sy - 130, ty, ou), ox = lerp(sx - 130, 90, ou), ow = lerp(260, BODY_W - 180, ou);
      ctx.save(); ctx.globalAlpha *= clamp(ou * 2, 0, 1);
      card(ox, oy, ow, 100, 22);
      text('💬', ox + 24, oy + 54, { px: 30, base: 'middle' });
      text(s.name, ox + 70, oy + 60, { w: 600, px: 25, alpha: ou });
      text(s.price, ox + ow - 26, oy + 62, { w: 700, px: 34, color: ou > .9 ? INK : BLUE, align: 'right' });
      ctx.restore();
    });
    const du = seg(t, a + L * .72, a + L * .72 + .5, outBack);
    if (du > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(du, 0, 1); ctx.translate(BODY_W / 2, 900); ctx.scale(du, du);
      ctx.fillStyle = BLUE; rr(-400, -60, 800, 120, 36); ctx.fill();
      text('3 ราคาในที่เดียว — เห็นราคาตลาดจริง ไม่ต้องโทรสักสาย', 0, 4, { w: 700, px: 32, color: '#fff', align: 'center', base: 'middle' });
      ctx.restore();
    }
  });
  ctx.restore();
}

/* A screenshot inside the phone, cropped to the screen and scrolled by `scroll` source pixels. */
function screen(img, box, scroll, alpha) {
  const sh = img.width * box.h / box.w;
  const sy = clamp(scroll, 0, Math.max(0, img.height - sh));
  ctx.save(); ctx.globalAlpha *= clamp(alpha == null ? 1 : alpha, 0, 1);
  rr(box.x, box.y, box.w, box.h, 50); ctx.clip();
  ctx.drawImage(img, 0, sy, img.width, sh, box.x, box.y, box.w, box.h);
  ctx.restore();
}
/* How it is used, in one scene: post, see every price, trust the price you get. */
function scene2(t) {
  const [a, b] = T.s2;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('icon:chart', 'ใช้งานจริง| เป็นแบบนี้', 'ราคาที่ได้ มาจากผู้ขายหลายรายที่แข่งกันเสนอ', t, a + .1);
  // the phone walks the site: browse, open a listing, post one, compare the offers, look back at what was sent
  if (SHOTS) pointsWithPhone(HOW_POINTS, [
    { img: 'feed',    from: 0,    to: 1400, card: 0 },
    { img: 'detail',  from: 0,    to: 900,  card: 0 },
    { img: 'compose', from: 0,    to: 500,  card: 0 },
    { img: 'compare', from: 2500, to: 3300, card: 1 },
    { img: 'mybids',  from: 0,    to: 700,  card: 2 }
  ], t, a, b);
  else pointList(HOW_POINTS, t, a);
  ctx.restore();
}

function sceneOutro(t) {
  const [a, b] = T.outro;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = Math.min(seg(t, a, a + .5), 1 - seg(t, b - .6, b, u => clamp(u, 0, 1)));
  let P;
  if (F.kind === 'portrait')    P = { my: 700, mh: 260, wy: 950, wpx: 120, dy: 1075, dpx: 38, sy: 1195, spx: 60, py: 1350, ppx: 44, ny: 1510, npx: 32 };
  else if (F.kind === 'square') P = { my: 270, mh: 200, wy: 470, wpx: 104, dy: 560, dpx: 32, sy: 650, spx: 50, py: 765, ppx: 40, ny: 900, npx: 30 };
  else                          P = { my: 240, mh: 220, wy: 470, wpx: 120, dy: 570, dpx: 36, sy: 670, spx: 60, py: 810, ppx: 44, ny: 960, npx: 32 };
  const u = seg(t, a + .1, a + .9, outBack);
  ctx.save(); ctx.translate(W / 2, P.my); ctx.scale(u, u);
  const im = IMG.markWhite; const mw = P.mh * im.width / im.height;
  ctx.drawImage(im, -mw / 2, -P.mh / 2, mw, P.mh);
  ctx.restore();
  const wu = seg(t, a + .6, a + 1.2);
  ctx.save(); ctx.globalAlpha *= wu;
  wordmark(W / 2 - wordmarkWidth(P.wpx) / 2, P.wy, P.wpx, true);
  ctx.restore();
  // what it is, read rather than said: the word "แพลตฟอร์ม" spoken sounds like advertising
  const du = seg(t, a + .75, a + 1.25);
  text('แพลตฟอร์มขอราคาและเปรียบเทียบราคา', W / 2, P.dy, { w: 500, px: P.dpx, color: 'rgba(255,255,255,.88)', align: 'center', alpha: du });
  const su = seg(t, a + 1.0, a + 1.5);
  // the site's own tagline
  text('โพสต์ความต้องการ ให้ตลาดเสนอให้คุณ', W / 2, P.sy + lerp(30, 0, su), { w: 700, px: P.spx * .92, color: '#fff', align: 'center', alpha: su });
  pill('qubequote.com', W / 2, P.py, { align: 'center', px: P.ppx, padX: 48, bg: '#fff', color: BLUE, alpha: seg(t, a + 2.0, a + 2.6) });
  text('ดูประกาศได้ทันที · สมัครฟรี · ไม่ต้องติดตั้งแอป', W / 2, P.ny, { w: 400, px: P.npx, color: 'rgba(255,255,255,.85)', align: 'center', alpha: seg(t, a + 2.5, a + 3.1) });
  ctx.restore();
}

const SCENES = [['hook', sceneHook], ['s1', scene1], ['s2', scene2], ['outro', t => sceneOutro(Math.min(t, DURATION - 1e-3))]];
const XFADE = .6;
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  let i = SCENES.findIndex(([k]) => t < T[k][1]);
  if (i < 0) i = SCENES.length - 1;
  SCENES[i][1](t);
  /* Over the last moments of a scene the next one is painted on top with rising
     alpha. Its own contents have not started (they key off its start time), so
     what comes up is its ground — blue under paper, paper under blue — and the
     outgoing scene's contents are already fading. No hard cut between grounds. */
  const end = T[SCENES[i][0]][1];
  if (i + 1 < SCENES.length && t > end - XFADE) {
    ctx.save(); ctx.globalAlpha = (t - (end - XFADE)) / XFADE;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    SCENES[i + 1][1](t);
    ctx.restore();
  }
}

boot();
</script>
