  canvas { display: block; max-width: 96vw; max-height: 90vh; margin: 20px auto; }

<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.min.js"></script>
<script src="/tools/clip/lib.js"></script>
<script>
/* ============================================================================
 * "QubeQuote คืออะไร" — the introduction, ~55 seconds, drawn frame by frame.
 *
 * The other clips are for people who already know the site and want to see
 * a page. This one is for people who have never heard of it: the old way
 * (ring every supplier, one at a time), the idea (post what you need, the
 * sellers come to you), what each side gets, why it is easy, and the site's
 * own tagline. No phone screens — a diagram and cards, in the brand colours.
 *
 * Everything is a pure function of time; framing, drawing kit, music and
 * encoder come from lib.js.
 * ?w=1920&h=1080 picks the framing. ?play=1 loops it; ?t=12.5 freezes a frame.
 * ========================================================================== */
'use strict';

/* ---- copy. Every name here is invented; no real account appears. ---- */
const ITEM = 'ชั้นวางสินค้าเหล็ก 20 ชุด';
const SELLERS = [
  { name: 'บจก. สยาม สตีล แร็ค',    price: '฿39,800', bg: '#dbe7ff' },
  { name: 'ร้านช่างเหล็กบางนา',     price: '฿36,500', bg: '#e6f6ea' },
  { name: 'บจก. ทีเค เมทัล ซัพพลาย', price: '฿41,200', bg: '#fff1d6' }
];
const BUYER_POINTS = [
  ['🧾', 'โพสต์สิ่งที่ต้องการ ฟรี',        'บอกว่าต้องการอะไร ที่ไหน งบเท่าไร แล้วรอ'],
  ['📊', 'เปรียบเทียบทุกข้อเสนอในหน้าเดียว', 'ราคา เงื่อนไข เอกสารแนบ ของทุกรายอยู่ที่เดียว'],
  ['✅', 'ตัดสินใจเองเมื่อพร้อม',           'ไม่มีใครเร่ง ดูให้ครบแล้วค่อยเลือก']
];
const SELLER_POINTS = [
  ['🔍', 'เจอลูกค้าที่ต้องการของคุณจริง ๆ',  'ผู้ซื้อโพสต์ความต้องการไว้แล้ว แค่เลือกงานที่ทำได้'],
  ['🖊️', 'เสนอราคาพร้อมแนบเอกสาร',          'ใบเสนอราคา แคตตาล็อก ตัวอย่างงาน ส่งไปด้วยกันได้'],
  ['🔒', 'ราคาปิดผนึก',                     'ผู้ขายรายอื่นมองไม่เห็นราคาของคุณ']
];
const TRUST_POINTS = [
  ['⚖️', 'เป็นกลาง',      'QubeQuote ไม่ใช่ผู้ขาย และไม่เลือกผู้ชนะแทนคุณ — คุณตัดสินใจเอง'],
  ['🔍', 'โปร่งใส',      'ทุกข้อเสนอเห็นครบ ทั้งราคา เงื่อนไข และเอกสารแนบ ไม่มีอะไรซ่อน'],
  ['🧾', 'ตรวจสอบได้',   'ข้อเสนอ ถาม-ตอบ และรีวิว เก็บไว้ในระบบ ย้อนดูได้ทุกเมื่อ']
];
const EASY_POINTS = [
  ['🌐', 'เปิดเว็บก็ใช้ได้เลย',             'ไม่ต้องติดตั้งแอป ใช้ได้ทั้งมือถือและคอม'],
  ['👀', 'ดูประกาศได้โดยไม่ต้องสมัคร',      'สมัครฟรีเมื่อพร้อมโพสต์หรือเสนอราคา'],
  ['💬', 'คุยกันได้ในที่เดียว',              'ถาม-ตอบใต้ประกาศ หรือแชตส่วนตัวกับอีกฝ่าย']
];

/* ---- timeline (seconds) ----
   These are the scene lengths without narration. With it, applyVoice()
   below stretches any scene whose line runs longer, so the voice never
   spills into the next picture; the lengths here are the minimums. */
const BASE = { hook: 6.0, s1: 10.0, s1b: 12.0, s2: 8.5, s3: 8.5, s4: 8.0, s5: 8.5, outro: 5.5 };
const ORDER = ['hook', 's1', 's1b', 's2', 's3', 's4', 's5', 'outro'];

/* ---- the real site: marketing/shots/*.png from node tools/build-shots.js ----
   Loaded before the first frame; if they are missing the scene is skipped
   and the clip says so in its log. */
let SHOTS = null;
async function prepare() {
  try {
    const names = ['feed', 'detail', 'auth', 'compose', 'compare', 'quote', 'mybids'];
    await Promise.all(names.map(n => loadImg('shot_' + n, '/marketing/shots/' + n + '.png')));
    SHOTS = {}; names.forEach(n => { SHOTS[n] = IMG['shot_' + n]; });
  } catch (e) { log('ไม่มีภาพหน้าเว็บ (marketing/shots) — ข้ามฉากหน้าเว็บจริง; รัน node tools/build-shots.js ก่อน'); }
}
let T = {}, DURATION = 0;
(function lay() { let t = 0; for (const k of ORDER) { T[k] = [t, t + BASE[k]]; t += BASE[k]; } DURATION = t; })();

/* ---- narration: tools/clip/intro.voice.json → node tools/build-voice.js intro ---- */
const VOICE_MANIFEST = '/marketing/voice/intro/manifest.json';
const LINE_OF = { hook: 'hook', s1: 'idea', s1b: 'shots', s2: 'buyer', s3: 'seller', s4: 'easy', s5: 'trust', outro: 'outro' };
function applyVoice(m) {
  const LEAD = .6, TAIL = .7;     // a beat of picture before the voice starts, and after it stops
  let t = 0;
  for (const k of ORDER) {
    const ln = m && m.lines.find(l => l.id === LINE_OF[k]);
    const len = k === 's1b' && !SHOTS ? 0 : Math.max(BASE[k], ln ? LEAD + ln.duration + TAIL : 0);
    T[k] = [t, t + len];
    if (ln) ln.at = t + LEAD;
    t += len;
  }
  DURATION = t;
}

/* ---- clip-specific helpers ---- */
function avatar(x, y, r, initial, bg, color) {
  ctx.fillStyle = bg || BLUE; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  text(initial, x, y + 2, { w: 700, px: r * .9, color: color || '#fff', align: 'center', base: 'middle' });
}
/* A benefit card: big emoji, a title, one line under it. */
function pointCard(p, x, y, w, u) {
  ctx.save(); ctx.globalAlpha *= clamp(u, 0, 1);
  ctx.translate(lerp(60, 0, clamp(u, 0, 1)), 0);
  card(x, y, w, 270, 28);
  ctx.fillStyle = BLUE_SOFT; rr(x + 34, y + 55, 160, 160, 36); ctx.fill();
  text(p[0], x + 114, y + 138, { px: 78, align: 'center', base: 'middle' });
  text(p[1], x + 230, y + 118, { w: 700, px: 36 });
  const lines = wrapText(p[2], 400, 27, w - 264);
  lines.forEach((ln, i) => text(ln, x + 230, y + 168 + i * 40, { w: 400, px: 27, color: INK_SOFT }));
  ctx.restore();
}
/* Three points in a compact stack, the phone under them showing the page each
   one is about; the point being shown is outlined. Beats are thirds of the
   scene, so a scene stretched for its narration keeps the same shape. */
function pointsWithPhone(points, beats, t, a, b) {
  const L = b - a, u = clamp((t - a) / L, 0, 1);
  const beat = Math.min(2, Math.floor(u * 3)), bu = u * 3 - beat;
  body(() => {
    points.forEach((p, i) => {
      const cu = seg(t, a + .4 + i * .35, a + 1.0 + i * .35);
      if (cu <= 0) return;
      const y = 10 + i * 162;
      ctx.save(); ctx.globalAlpha *= cu; ctx.translate(lerp(40, 0, cu), 0);
      card(0, y, BODY_W, 148, 24);
      if (i === beat) { ctx.strokeStyle = BLUE; ctx.lineWidth = 5; rr(0, y, BODY_W, 148, 24); ctx.stroke(); }
      ctx.fillStyle = BLUE_SOFT; rr(24, y + 26, 96, 96, 24); ctx.fill();
      text(p[0], 72, y + 76, { px: 50, align: 'center', base: 'middle' });
      text(p[1], 148, y + 64, { w: 700, px: 31 });
      text(p[2], 148, y + 110, { w: 400, px: 24, color: INK_SOFT });
      ctx.restore();
    });
    const pu = seg(t, a + .3, a + 1.0);
    ctx.save(); ctx.globalAlpha *= pu;
    ctx.translate((BODY_W - 800 * .62) / 2, 520 + lerp(80, 0, pu)); ctx.scale(.62, .62);
    const box = phone(0, 0, 800, 1180, { blank: true });
    // the previous page fades out under the new one
    const cur = beats[beat], prev = beats[beat - 1];
    if (prev && bu < .15) screen(SHOTS[prev.img], box, prev.to, 1);
    const slide = beat > 0 ? lerp(box.w, 0, outCubic(clamp(bu * 4, 0, 1))) : 0;
    ctx.save(); ctx.translate(slide, 0);
    screen(SHOTS[cur.img], box, lerp(cur.from, cur.to, inOutCubic(clamp((bu - .2) / .7, 0, 1))), 1);
    ctx.restore();
    ctx.restore();
  });
}
function pointList(points, t, a) {
  body(() => {
    points.forEach((p, i) => pointCard(p, 0, 80 + i * 330, BODY_W, seg(t, a + .4 + i * .45, a + 1.0 + i * .45)));
  });
}
/* A phone handset drawn with strokes, so it can shake and be crossed out. */
function handset(x, y, s, wobble, crossed) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(wobble); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-42, -40); ctx.quadraticCurveTo(-52, 30, 10, 48); ctx.quadraticCurveTo(40, 52, 46, 38);
  ctx.lineTo(30, 12); ctx.lineTo(10, 22); ctx.quadraticCurveTo(-20, 4, -16, -26); ctx.lineTo(-6, -36); ctx.lineTo(-24, -58); ctx.closePath(); ctx.stroke();
  if (crossed > 0) {
    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 16;
    const k1 = clamp(crossed * 2, 0, 1), k2 = clamp(crossed * 2 - 1, 0, 1);
    ctx.beginPath(); ctx.moveTo(-70, -70); ctx.lineTo(lerp(-70, 70, k1), lerp(-70, 70, k1)); ctx.stroke();
    if (k2 > 0) { ctx.beginPath(); ctx.moveTo(70, -70); ctx.lineTo(lerp(70, -70, k2), lerp(-70, 70, k2)); ctx.stroke(); }
  }
  ctx.restore();
}

/* ====================== SCENES ====================== */

/* The old way: three suppliers, three calls, still no comparison. */
function sceneHook(t) {
  const [a, b] = T.hook;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .5);
  topBrand(true);
  let P;
  if (F.kind === 'portrait')    P = { hy: 560, hs: 1, gap: 300, tx: W / 2, y1: 900, y2: 1020, sy: 1200, px: 70, spx: 46, align: 'center', wrap: 940 };
  else if (F.kind === 'square') P = { hy: 250, hs: .75, gap: 250, tx: W / 2, y1: 500, y2: 600, sy: 760, px: 60, spx: 40, align: 'center', wrap: 940 };
  else                          P = { hy: H / 2 - 40, hs: .8, gap: 230, hx: 520, tx: 860, y1: H / 2 - 120, y2: H / 2 - 20, sy: H / 2 + 130, px: 62, spx: 42, align: 'left', wrap: 820 };
  const cx = P.hx || W / 2;
  for (let i = 0; i < 3; i++) {
    const u = seg(t, a + .2 + i * .25, a + .8 + i * .25, outBack);
    if (u <= 0) continue;
    const ring = t > a + 1.0 ? Math.sin((t - a) * 22 + i) * .12 * fadeInOut(t, a + 1.0, a + 3.6, .3) : 0;
    const crossed = seg(t, a + 3.7 + i * .15, a + 4.3 + i * .15, u => clamp(u, 0, 1));
    const px = F.kind === 'landscape' ? cx : cx + (i - 1) * P.gap;
    const py = F.kind === 'landscape' ? P.hy + (i - 1) * P.gap : P.hy;
    handset(px, py, P.hs * u, ring, crossed);
  }
  const l1 = seg(t, a + 1.2, a + 1.8), l2 = seg(t, a + 1.6, a + 2.2), l3 = seg(t, a + 4.3, a + 4.9);
  text('ซื้อของให้บริษัท', P.tx, P.y1 + lerp(40, 0, l1), { w: 700, px: P.px, color: '#fff', align: P.align, alpha: l1 });
  text('ยังโทรถามราคาทีละเจ้าอยู่ไหม?', P.tx, P.y2 + lerp(40, 0, l2), { w: 700, px: P.px, color: '#fff', align: P.align, alpha: l2 });
  text('มีวิธีที่ง่ายกว่านั้น', P.tx, P.sy, { w: 500, px: P.spx, color: 'rgba(255,255,255,.9)', align: P.align, alpha: l3 });
  ctx.restore();
}

/* The idea, as a picture: one post at the top, offers coming up to it. */
function scene1(t) {
  const [a, b] = T.s1;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('💡', 'QubeQuote| คืออะไร', 'ตลาดกลางที่ผู้ซื้อโพสต์สิ่งที่ต้องการ แล้วผู้ขายเสนอราคามาหา', t, a + .1);
  body(() => {
    // the buyer's post
    const pu = seg(t, a + .4, a + 1.0, outBack);
    ctx.save(); ctx.globalAlpha *= clamp(pu, 0, 1);
    const px = 90, py = 40 + lerp(-60, 0, clamp(pu, 0, 1)), pw = BODY_W - 180;
    card(px, py, pw, 230, 28);
    avatar(px + 64, py + 64, 32, 'คุณ', BLUE_SOFT, BLUE);
    text('ผู้ซื้อ', px + 112, py + 58, { w: 700, px: 28 });
    text('โพสต์สิ่งที่ต้องการ', px + 112, py + 92, { w: 400, px: 24, color: INK_SOFT });
    pill('ต้องการซื้อ', px + pw - 30, py + 40, { align: 'right', px: 22, h: 40, padX: 16, bg: BLUE, color: '#fff' });
    text(ITEM, px + 30, py + 160, { w: 700, px: 34 });
    text('📍 ชลบุรี · 💰 งบ ฿40,000', px + 30, py + 202, { w: 400, px: 24, color: INK_SOFT });
    ctx.restore();
    // sellers below, each sending an offer up
    const sy = 1120;
    SELLERS.forEach((s, i) => {
      const sx = 150 + i * 280;
      const su = seg(t, a + 1.2 + i * .2, a + 1.7 + i * .2, outBack);
      if (su <= 0) return;
      ctx.save(); ctx.globalAlpha *= clamp(su, 0, 1); ctx.translate(sx, sy); ctx.scale(su, su);
      avatar(0, 0, 54, s.name.replace(/^(บจก\. |ร้าน)/, '').charAt(0), s.bg, INK);
      ctx.restore();
      wrapText(s.name, 500, 22, 260).forEach((ln, k) => text(ln, sx, sy + 90 + k * 28, { w: 500, px: 22, color: INK_SOFT, align: 'center', alpha: su }));
      // the offer travels up the dashed line to sit under the post
      const ou = seg(t, a + 2.6 + i * .7, a + 3.6 + i * .7, inOutCubic);
      if (ou <= 0) return;
      ctx.save(); ctx.strokeStyle = '#c9d3ea'; ctx.lineWidth = 3; ctx.setLineDash([12, 12]);
      ctx.beginPath(); ctx.moveTo(sx, sy - 60); ctx.lineTo(sx, 300 + i * 0 + 240); ctx.stroke(); ctx.restore();
      const ty = 320 + i * 118;
      const oy = lerp(sy - 130, ty, ou), ox = lerp(sx - 130, 90, ou), ow = lerp(260, BODY_W - 180, ou);
      ctx.save(); ctx.globalAlpha *= clamp(ou * 2, 0, 1);
      card(ox, oy, ow, 100, 22);
      text('💬', ox + 24, oy + 54, { px: 30, base: 'middle' });
      text(s.name, ox + 70, oy + 60, { w: 600, px: 25, alpha: ou });
      text(s.price, ox + ow - 26, oy + 62, { w: 700, px: 34, color: ou > .9 ? INK : BLUE, align: 'right' });
      ctx.restore();
    });
    const du = seg(t, a + 6.2, a + 6.8, outBack);
    if (du > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(du, 0, 1); ctx.translate(BODY_W / 2, 900); ctx.scale(du, du);
      ctx.fillStyle = BLUE; rr(-400, -60, 800, 120, 36); ctx.fill();
      text('3 ข้อเสนอ ในที่เดียว — ไม่ต้องโทรสักสาย', 0, 4, { w: 700, px: 34, color: '#fff', align: 'center', base: 'middle' });
      ctx.restore();
    }
  });
  ctx.restore();
}

/* A screenshot inside the phone, cropped to the screen and scrolled by `scroll` source pixels. */
function screen(img, box, scroll, alpha) {
  const sh = img.width * box.h / box.w;
  const sy = clamp(scroll, 0, Math.max(0, img.height - sh));
  ctx.save(); ctx.globalAlpha *= clamp(alpha == null ? 1 : alpha, 0, 1);
  rr(box.x, box.y, box.w, box.h, 50); ctx.clip();
  ctx.drawImage(img, 0, sy, img.width, sh, box.x, box.y, box.w, box.h);
  ctx.restore();
}
/* The real site, as it is today: the feed, a listing, the sign-in page. */
function scene1b(t) {
  const [a, b] = T.s1b;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('📱', 'หน้าเว็บจริง| เป็นแบบนี้', 'ภาพจากเว็บจริง — ฟีดประกาศ หน้ารายละเอียด และหน้าเข้าสู่ระบบ', t, a + .1);
  const pu = seg(t, a + .3, a + 1.0);
  const L = b - a, u = (t - a) / L;                 // beats as fractions of the scene, so a stretched scene keeps its shape
  const B = [0, .40, .72, 1];
  body(() => {
    ctx.globalAlpha *= pu;
    const box = phone(30, 30 + lerp(120, 0, pu), 800, 1180, { blank: true });
    // feed: scroll down through the listings
    if (u < B[1] + .06) {
      const k = clamp((u - .05) / (B[1] - .12), 0, 1);
      screen(SHOTS.feed, box, inOutCubic(k) * 1900, 1 - clamp((u - B[1]) / .06, 0, 1));
    }
    // listing: slides in, scrolls a little
    if (u >= B[1] && u < B[2] + .06) {
      const k = clamp((u - B[1]) / (B[2] - B[1]), 0, 1);
      ctx.save(); ctx.translate(lerp(box.w, 0, outCubic(clamp(k * 4, 0, 1))), 0);
      screen(SHOTS.detail, box, inOutCubic(clamp((k - .3) / .7, 0, 1)) * 900, 1 - clamp((u - B[2]) / .06, 0, 1));
      ctx.restore();
    }
    // sign-in: fades in
    if (u >= B[2]) {
      const k = clamp((u - B[2]) / (1 - B[2]), 0, 1);
      screen(SHOTS.auth, box, 330, clamp(k * 5, 0, 1));
    }
    const cap = u < B[1] ? '👀 ฟีดประกาศ — ดูได้โดยไม่ต้องสมัคร' : u < B[2] ? '📄 หน้ารายละเอียด — สเปก ไฟล์แนบ ถาม-ตอบ' : '🔑 เข้าสู่ระบบด้วย Google หรือ LINE';
    const cu = Math.min(seg(t, a + .8, a + 1.3), 1);
    ctx.save(); ctx.globalAlpha *= cu; ctx.translate(box.x + box.w / 2, box.y + box.h - 70);
    pill(cap, 0, -36, { align: 'center', px: 27, bg: INK, color: '#fff' });
    ctx.restore();
  });
  ctx.restore();
}

function scene2(t) {
  const [a, b] = T.s2;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('🛒', 'สำหรับ| ผู้ซื้อ', 'โรงงาน บริษัท ร้านค้า หรือใครก็ตามที่ต้องหาของ หาผู้รับเหมา', t, a + .1);
  if (SHOTS) pointsWithPhone(BUYER_POINTS, [{ img: 'compose', from: 0, to: 700 }, { img: 'compare', from: 2500, to: 3100 }, { img: 'compare', from: 3300, to: 3900 }], t, a, b);
  else pointList(BUYER_POINTS, t, a);
  ctx.restore();
}

function scene3(t) {
  const [a, b] = T.s3;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('🏭', 'สำหรับ| ผู้ขาย', 'ผู้ผลิต ผู้จัดจำหน่าย ผู้รับเหมา ช่าง และผู้ให้บริการ', t, a + .1);
  if (SHOTS) pointsWithPhone(SELLER_POINTS, [{ img: 'detail', from: 0, to: 700 }, { img: 'quote', from: 900, to: 1400 }, { img: 'mybids', from: 0, to: 600 }], t, a, b);
  else pointList(SELLER_POINTS, t, a);
  ctx.restore();
}

function scene4(t) {
  const [a, b] = T.s4;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('⚡', 'ง่ายตั้งแต่| วันแรก', 'ไม่ต้องเรียนรู้อะไรใหม่ — เปิดเว็บแล้วเริ่มได้เลย', t, a + .1);
  pointList(EASY_POINTS, t, a);
  ctx.restore();
}

function scene5(t) {
  const [a, b] = T.s5;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader('🤝', 'เป็นกลาง โปร่งใส| ตรวจสอบได้', 'หลักที่ QubeQuote ยึดไว้ ทั้งกับผู้ซื้อและผู้ขาย', t, a + .1);
  pointList(TRUST_POINTS, t, a);
  ctx.restore();
}

function sceneOutro(t) {
  const [a, b] = T.outro;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = Math.min(seg(t, a, a + .5), 1 - seg(t, b - .6, b, u => clamp(u, 0, 1)));
  let P;
  if (F.kind === 'portrait')    P = { my: 700, mh: 260, wy: 950, wpx: 120, sy: 1100, spx: 60, ty: 1200, tpx: 40, py: 1330, ppx: 44, ny: 1500, npx: 32 };
  else if (F.kind === 'square') P = { my: 270, mh: 200, wy: 470, wpx: 104, sy: 585, spx: 50, ty: 665, tpx: 34, py: 760, ppx: 40, ny: 900, npx: 30 };
  else                          P = { my: 240, mh: 220, wy: 470, wpx: 120, sy: 610, spx: 60, ty: 700, tpx: 38, py: 800, ppx: 44, ny: 960, npx: 32 };
  const u = seg(t, a + .1, a + .9, outBack);
  ctx.save(); ctx.translate(W / 2, P.my); ctx.scale(u, u);
  const im = IMG.markWhite; const mw = P.mh * im.width / im.height;
  ctx.drawImage(im, -mw / 2, -P.mh / 2, mw, P.mh);
  ctx.restore();
  const wu = seg(t, a + .6, a + 1.2);
  ctx.save(); ctx.globalAlpha *= wu;
  wordmark(W / 2 - wordmarkWidth(P.wpx) / 2, P.wy, P.wpx, true);
  ctx.restore();
  const su = seg(t, a + 1.1, a + 1.7);
  // the site's own tagline
  text('ต้องการอะไร ให้ตลาดเสนอให้คุณ', W / 2, P.sy + lerp(30, 0, su), { w: 700, px: P.spx, color: '#fff', align: 'center', alpha: su });
  const tu = seg(t, a + 1.5, a + 2.1);
  text('เป็นกลาง · โปร่งใส · ตรวจสอบได้', W / 2, P.ty + lerp(20, 0, tu), { w: 500, px: P.tpx, color: 'rgba(255,255,255,.9)', align: 'center', alpha: tu });
  pill('qubequote.com', W / 2, P.py, { align: 'center', px: P.ppx, padX: 48, bg: '#fff', color: BLUE, alpha: seg(t, a + 2.0, a + 2.6) });
  text('ดูประกาศได้ทันที · สมัครฟรี · ไม่ต้องติดตั้งแอป', W / 2, P.ny, { w: 400, px: P.npx, color: 'rgba(255,255,255,.85)', align: 'center', alpha: seg(t, a + 2.5, a + 3.1) });
  ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  if (t < T.hook[1]) sceneHook(t);
  else if (t < T.s1[1]) scene1(t);
  else if (t < T.s1b[1]) scene1b(t);
  else if (t < T.s2[1]) scene2(t);
  else if (t < T.s3[1]) scene3(t);
  else if (t < T.s4[1]) scene4(t);
  else if (t < T.s5[1]) scene5(t);
  else sceneOutro(Math.min(t, DURATION - 1e-3));
}

boot();
</script>
