<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>QubeQuote — เสนอราคาใน QubeQuote (ฝั่งผู้ขาย)</title>
<!-- FONTS -->
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; max-width: 96vw; max-height: 90vh; margin: 20px auto; }
  #log { color: #ccc; font: 13px monospace; white-space: pre; margin: 0 20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.min.js"></script>
<script src="/tools/clip/lib.js"></script>
<script>
/* ============================================================================
 * "เสนอราคาใน QubeQuote" — the seller's side, ~60 seconds, drawn frame by frame.
 *
 * The other two clips follow the buyer. This one follows a seller through
 * the pages as they are on the site: pick a listing off the feed, read its
 * detail page (spec, pictures, attachments, budget, deadline), ask under
 * ❓ คำถามเกี่ยวกับงานนี้, send a price through เสนอราคาสำหรับงานนี้ with a
 * quotation and other files attached, then find it again on ใบเสนอราคา ที่ส่ง.
 *
 * Everything is a pure function of time; framing, drawing kit, music and
 * encoder come from lib.js.
 * ?w=1920&h=1080 picks the framing. ?play=1 loops it; ?t=12.5 freezes a frame.
 * ========================================================================== */
'use strict';

/* ---- copy. Every name here is invented; no real account appears. ---- */
const ITEM = 'ชั้นวางสินค้าเหล็ก 20 ชุด';
const BUYER = 'บจก. ตะวันออก คลังสินค้า';
const MY_PRICE = '39,800';
const FEED = [
  { title: ITEM,                                       meta: '📍 ชลบุรี · 💬 2 ข้อเสนอ',       when: '2 ชม. ที่แล้ว' },
  { title: 'ชั้นวางพาเลทเหล็ก 50 ชุด',               meta: '📍 สมุทรปราการ · 💬 1 ข้อเสนอ', when: 'เมื่อวาน' },
  { title: 'จ้างขนส่งเครื่องจักร 5 ตัน ไประยอง',      meta: '📍 กรุงเทพฯ · 💬 5 ข้อเสนอ',     when: 'เมื่อวาน' }
];
const FILES = [
  ['📄', 'ใบเสนอราคา-ชั้นวาง.pdf', '240 KB'],
  ['📄', 'แคตตาล็อกสินค้า.pdf', '1.8 MB'],
  ['🖼️', 'ตัวอย่างงานติดตั้ง.jpg', '620 KB']
];
const SENT = [
  { title: ITEM,                                    buyer: BUYER,                     prov: 'ชลบุรี',       on: '14 ก.ย. 69', files: 3, price: MY_PRICE, open: true,  until: '30 ก.ย. 69' },
  { title: 'ตัดเลเซอร์แผ่นเหล็ก 2 มม. 300 ชิ้น',   buyer: 'หจก. พีเอส พรีซิชั่น',    prov: 'สมุทรปราการ', on: '10 ก.ย. 69', files: 1, price: '27,500', open: true,  until: '25 ก.ย. 69' },
  { title: 'โครงเหล็กหลังคาโกดัง 12×30 ม.',        buyer: 'บจก. เกษตรรุ่งเรือง ฟาร์ม', prov: 'ระยอง',        on: '28 ส.ค. 69', files: 2, price: '485,000', open: false, until: '5 ก.ย. 69' }
];

/* ---- timeline (seconds) ---- */
const T = {
  hook: [0, 5.0],
  s1:   [5.0, 13.0],
  s2:   [13.0, 23.0],
  s3:   [23.0, 33.0],
  s4:   [33.0, 46.0],
  s5:   [46.0, 55.0],
  outro:[55.0, 60.0]
};
const DURATION = T.outro[1];
const STEPS = 5;

/* ---- clip-specific helpers ---- */
/* A picture placeholder: pale blue tile with the mountain glyph. */
function thumb(x, y, w, h, r) {
  ctx.fillStyle = BLUE_SOFT; rr(x, y, w, h, r || 18); ctx.fill();
  const cx = x + w / 2, cy = y + h / 2, s = Math.min(w, h) / 150;
  ctx.fillStyle = BLUE; ctx.beginPath();
  ctx.moveTo(cx - 55 * s, cy + 40 * s); ctx.lineTo(cx - 15 * s, cy - 18 * s); ctx.lineTo(cx + 12 * s, cy + 14 * s);
  ctx.lineTo(cx + 30 * s, cy - 6 * s); ctx.lineTo(cx + 58 * s, cy + 40 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 32 * s, cy - 34 * s, 11 * s, 0, Math.PI * 2); ctx.fill();
}
function avatar(x, y, r, initial, bg, color) {
  ctx.fillStyle = bg || BLUE; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  text(initial, x, y + 2, { w: 700, px: r * .9, color: color || '#fff', align: 'center', base: 'middle' });
}
/* A feed card as the feed draws it: picture, title, place · offers, age. */
function feedCard(it, x, y, w, o) {
  o = o || {};
  card(x, y, w, 206, 24);
  if (o.hl) { ctx.save(); ctx.globalAlpha *= o.hl; ctx.strokeStyle = BLUE; ctx.lineWidth = 5; rr(x, y, w, 206, 24); ctx.stroke(); ctx.restore(); }
  thumb(x + 28, y + 28, 150, 150);
  text(it.title, x + 206, y + 74, { w: 700, px: 30 });
  text(it.meta, x + 206, y + 122, { w: 400, px: 25, color: INK_SOFT });
  text(it.when, x + 206, y + 166, { w: 400, px: 23, color: '#8a90a3' });
}
/* One bubble of the Q&A block: who asked, the question, the answer (if any). */
function qa(x, y, w, who, q, ans, o) {
  o = o || {};
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha, 0, 1);
  const h = ans ? 196 : 130;
  ctx.fillStyle = '#fff'; rr(x, y, w, h, 20); ctx.fill(); ctx.strokeStyle = LINE; ctx.lineWidth = 2; rr(x, y, w, h, 20); ctx.stroke();
  avatar(x + 42, y + 44, 22, who.charAt(0), o.me ? BLUE : '#dbe7ff', o.me ? '#fff' : INK);
  text(who, x + 78, y + 40, { w: 700, px: 24 });
  text('· ' + (o.when || 'เมื่อสักครู่'), x + 78 + measure(who, 700, 24) + 10, y + 40, { w: 400, px: 22, color: '#8a90a3' });
  text(q, x + 78, y + 84, { w: 500, px: 27 });
  if (ans) {
    ctx.fillStyle = LINE; ctx.fillRect(x + 78, y + 108, w - 106, 2);
    pill('เจ้าของประกาศ', x + 78, y + 124, { px: 20, h: 34, padX: 14, bg: GREEN_SOFT, color: GREEN });
    text(ans, x + 78, y + 182, { w: 500, px: 26, color: INK });
  } else if (o.waiting) {
    text('รอเจ้าของประกาศตอบ', x + w - 28, y + 40, { w: 400, px: 22, color: '#8a90a3', align: 'right' });
  }
  ctx.restore();
  return h;
}

/* ====================== SCENES ====================== */

function sceneHook(t) {
  const [a, b] = T.hook;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .5);
  topBrand(true);
  let P;
  if (F.kind === 'portrait')    P = { bx: W / 2, by: 590, br: 160, bpx: 190, tx: W / 2, ky: 850, y1: 1000, y2: 1120, sy: 1250, px: 80, spx: 42, align: 'center', wrap: 900 };
  else if (F.kind === 'square') P = { bx: W / 2, by: 260, br: 120, bpx: 140, tx: W / 2, ky: 450, y1: 590, y2: 690, sy: 800, px: 72, spx: 36, align: 'center', wrap: 900 };
  else                          P = { bx: 620, by: H / 2, br: 180, bpx: 210, tx: 950, ky: H / 2 - 250, y1: H / 2 - 100, y2: H / 2 + 10, sy: H / 2 + 140, px: 80, spx: 40, align: 'left', wrap: 860 };
  const u0 = seg(t, a + .1, a + .9, outBack);
  const bob = Math.sin(t * 2.2) * 12;
  ctx.save(); ctx.translate(P.bx, P.by + bob); ctx.scale(u0, u0);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, P.br, 0, Math.PI * 2); ctx.fill();
  text('฿', 0, P.br * .08, { w: 700, px: P.bpx, color: BLUE, align: 'center', base: 'middle' });
  ctx.restore();
  const k = seg(t, a + .5, a + 1.0);
  pill('สำหรับผู้ขาย', P.tx, P.ky, { align: P.align === 'center' ? 'center' : 'left', px: 34, padX: 32, bg: 'rgba(255,255,255,.18)', color: '#fff', border: 'rgba(255,255,255,.7)', alpha: k });
  const l1 = seg(t, a + .8, a + 1.4), l2 = seg(t, a + 1.15, a + 1.75), l3 = seg(t, a + 2.0, a + 2.6);
  text('เสนอราคาใน QubeQuote', P.tx, P.y1 + lerp(40, 0, l1), { w: 700, px: P.px, color: '#fff', align: P.align, alpha: l1 });
  text('ผู้ซื้อรออยู่แล้ว', P.tx, P.y2 + lerp(40, 0, l2), { w: 700, px: P.px, color: '#fff', align: P.align, alpha: l2 });
  const lines = wrapText('ผู้ซื้อโพสต์สิ่งที่ต้องการไว้แล้ว — คุณแค่เลือกงานที่ทำได้ แล้วส่งราคา', 500, P.spx, P.wrap);
  lines.forEach((ln, i) => text(ln, P.tx, P.sy + i * P.spx * 1.5, { w: 500, px: P.spx, color: 'rgba(255,255,255,.85)', align: P.align, alpha: l3 }));
  ctx.restore();
}

/* 1 — pick a listing off the feed. */
function scene1(t) {
  const [a, b] = T.s1;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(1, 'เลือกงาน| ที่คุณทำได้', 'เลื่อนดูงานที่ผู้ซื้อกำลังหาผู้ขาย กรองตามจังหวัดหรือค้นหาคำได้', t, a + .1);
  const pu = seg(t, a + .3, a + 1.0);
  body(() => {
    ctx.globalAlpha *= pu;
    const box = phone(30, 30 + lerp(120, 0, pu), 800, 1180);
    const fx = box.x + 40, fy = box.y + 40, fw = box.w - 80;
    text('ประกาศ', fx, fy + 36, { w: 700, px: 44 });
    text('งานที่ผู้ซื้อกำลังมองหาผู้ขายอยู่ตอนนี้', fx, fy + 86, { w: 400, px: 25, color: INK_SOFT });
    // the search pill, typed into
    const q = typed('ชั้นวาง', t, a + 1.4, a + 2.4);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = q ? BLUE : LINE; ctx.lineWidth = 3; rr(fx, fy + 112, fw, 72, 36); ctx.fill(); ctx.stroke();
    text('🔍', fx + 26, fy + 150, { px: 26, base: 'middle' });
    text(q || 'ค้นหางาน สินค้า บริการ...', fx + 70, fy + 150, { w: 500, px: 27, color: q ? INK : '#aeb6c8', base: 'middle' });
    if (q && t < a + 2.8 && blink(t)) { ctx.fillStyle = BLUE; ctx.fillRect(fx + 72 + measure(q, 500, 27), fy + 130, 3, 40); }
    text('📍 สถานที่ ⌄', fx, fy + 236, { w: 500, px: 25, color: INK_SOFT });
    text('ล่าสุด ⌄', fx + 190, fy + 236, { w: 500, px: 25, color: INK_SOFT });
    const press = pressAt(t, a + 5.2);
    FEED.forEach((it, i) => {
      // after the search only the two matching listings stay
      const gone = q.length === 'ชั้นวาง'.length && i > 1 ? 1 - seg(t, a + 2.5, a + 3.0, u => clamp(u, 0, 1)) : 1;
      const u = seg(t, a + .8 + i * .25, a + 1.4 + i * .25);
      if (u <= 0 || gone <= 0) return;
      const y = fy + 276 + i * 230 + lerp(50, 0, u);
      ctx.save(); ctx.globalAlpha *= u * gone;
      if (i === 0) { ctx.translate(fx + fw / 2, y + 103); ctx.scale(1 - press * .04, 1 - press * .04); ctx.translate(-(fx + fw / 2), -(y + 103)); }
      feedCard(it, fx, y, fw, { hl: i === 0 ? seg(t, a + 3.2, a + 3.7) : 0 });
      ctx.restore();
    });
    tap(fx + fw / 2, fy + 380, t, a + 5.1);
    const su = seg(t, a + 3.8, a + 4.4, outBack);
    if (su > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(su, 0, 1); ctx.translate(box.x + box.w / 2, box.y + box.h - 90); ctx.scale(su, su);
      pill('👆 กดที่ประกาศเพื่อดูรายละเอียด', 0, -36, { align: 'center', px: 28, bg: INK, color: '#fff' });
      ctx.restore();
    }
  });
  dots(0, STEPS);
  ctx.restore();
}

/* 2 — the detail page, as the site lays it out. */
function scene2(t) {
  const [a, b] = T.s2;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(2, 'อ่านรายละเอียด| ให้ครบ', 'สเปก รูป ไฟล์แนบ งบประมาณ และวันปิดรับ อยู่ในหน้าเดียว', t, a + .1);
  const pu = seg(t, a + .3, a + 1.0);
  body(() => {
    ctx.globalAlpha *= pu;
    const box = phone(30, 30 + lerp(120, 0, pu), 800, 1180);
    const fx = box.x + 36, fy = box.y + 30, fw = box.w - 72;
    const sec = (i) => seg(t, a + .8 + i * .45, a + 1.3 + i * .45);
    text('‹  ประกาศซื้อ (RFQ)', fx, fy + 20, { w: 500, px: 24, color: BLUE });
    ctx.save(); ctx.globalAlpha *= sec(0);
    pill('🛒 ต้องการซื้อ', fx, fy + 52, { px: 22, h: 42, padX: 16, bg: BLUE_SOFT, color: BLUE });
    pill('🟢 เปิดรับ', fx + 230, fy + 52, { px: 22, h: 42, padX: 16, bg: GREEN_SOFT, color: GREEN });
    text('🔗 แชร์   🔖', fx + fw, fy + 82, { w: 500, px: 22, color: INK_SOFT, align: 'right' });
    avatar(fx + 26, fy + 140, 26, BUYER.replace(/^บจก\. /, '').charAt(0), '#dbe7ff', INK);
    text(BUYER, fx + 66, fy + 132, { w: 700, px: 25 });
    text('โพสต์เมื่อ 2 ชม. ที่แล้ว', fx + 66, fy + 162, { w: 400, px: 21, color: '#8a90a3' });
    text(ITEM, fx, fy + 232, { w: 700, px: 38 });
    text('📍 ชลบุรี  ·  🕗 ปิดรับ 30 ก.ย. 69  ·  💰 งบประมาณ ฿40,000', fx, fy + 278, { w: 400, px: 23, color: INK_SOFT });
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= sec(1);
    thumb(fx, fy + 310, 220, 160); thumb(fx + 238, fy + 310, 220, 160);
    ctx.fillStyle = '#f1f3f8'; rr(fx + 476, fy + 310, 220, 160, 18); ctx.fill();
    text('+2', fx + 586, fy + 394, { w: 700, px: 34, color: INK_SOFT, align: 'center', base: 'middle' });
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= sec(2);
    ['ชั้นวางเหล็ก 4 ชั้น ขนาด 200×60×200 ซม. รับน้ำหนักชั้นละ 300 กก.',
     'ใช้ในคลังสินค้าใหม่ ต้องการพร้อมติดตั้งหน้างาน'].forEach((ln, i) => text(ln, fx, fy + 520 + i * 40, { w: 400, px: 25 }));
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= sec(3);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = LINE; ctx.lineWidth = 2; rr(fx, fy + 610, fw, 84, 18); ctx.fill(); ctx.stroke();
    text('📎 ไฟล์แนบ (1) · กดเพื่อดู ›', fx + 26, fy + 660, { w: 600, px: 26, color: BLUE });
    text('แบบชั้นวาง.pdf', fx + fw - 26, fy + 660, { w: 400, px: 24, color: INK_SOFT, align: 'right' });
    ctx.restore();
    const bu = sec(4);
    const bw = (fw - 20) / 2;
    button('💬 สอบถามรายละเอียด', fx + bw / 2, fy + 770, bw, 90, { alpha: bu, bg: '#fff', border: BLUE, color: BLUE, px: 27 });
    button('🖊️ เสนอราคานี้', fx + bw + 20 + bw / 2, fy + 770, bw, 90, { alpha: bu, px: 27 });
    ctx.save(); ctx.globalAlpha *= sec(5);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = LINE; ctx.lineWidth = 2; rr(fx, fy + 850, fw, 120, 18); ctx.fill(); ctx.stroke();
    text('❓ คำถามเกี่ยวกับงานนี้ (1)', fx + 26, fy + 896, { w: 700, px: 26 });
    text('ถามเรื่องสเปกหรือเงื่อนไขงาน แล้วเจ้าของประกาศตอบให้ที่นี่', fx + 26, fy + 936, { w: 400, px: 22, color: INK_SOFT });
    ctx.restore();
  });
  dots(1, STEPS);
  ctx.restore();
}

/* 3 — ask under the listing, and be answered there. */
function scene3(t) {
  const [a, b] = T.s3;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(3, 'ไม่ชัวร์| ถามก่อนได้', 'ถามใต้ประกาศให้ทุกคนเห็นคำตอบ หรือแชตส่วนตัวผ่าน สอบถามรายละเอียด', t, a + .1);
  const pu = seg(t, a + .3, a + 1.0);
  body(() => {
    ctx.globalAlpha *= pu;
    const box = phone(30, 30 + lerp(120, 0, pu), 800, 1180);
    const fx = box.x + 36, fy = box.y + 30, fw = box.w - 72;
    text('❓ คำถามเกี่ยวกับงานนี้', fx, fy + 44, { w: 700, px: 32 });
    let y = fy + 80;
    y += qa(fx, y, fw, 'ร้านช่างเหล็กบางนา', 'มีแบบ CAD ให้ไหมครับ?', 'มีครับ อยู่ในไฟล์แนบของประกาศ', { when: '1 ชม. ที่แล้ว' }) + 20;
    // the new question, typed then asked
    const Q = 'รับติดตั้งหน้างานด้วยไหมครับ?';
    const asked = t >= a + 4.6;
    const q = typed(Q, t, a + 1.6, a + 3.8);
    if (asked) {
      const au = seg(t, a + 4.6, a + 5.1);
      const answered = t >= a + 7.0;
      y += qa(fx, y, fw, 'คุณ', Q, answered ? 'ต้องการให้ติดตั้งด้วยครับ รวมในราคาได้เลย' : null, { me: true, waiting: !answered, alpha: au }) + 20;
      if (answered) { const nu = seg(t, a + 7.0, a + 7.4, outBack); if (nu > 0) { ctx.save(); ctx.globalAlpha *= clamp(nu, 0, 1); ctx.translate(fx + fw - 90, y - 216 + 40); ctx.scale(nu, nu); pill('🔔 ตอบแล้ว', 0, -18, { align: 'center', px: 20, h: 36, padX: 14, bg: GREEN, color: '#fff' }); ctx.restore(); } }
    }
    y += 10;
    text('ถามคำถามใหม่', fx, y + 20, { w: 600, px: 24, color: INK_SOFT });
    const typing = q.length > 0 && !asked;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = typing ? BLUE : LINE; ctx.lineWidth = 3; rr(fx, y + 40, fw - 140, 80, 16); ctx.fill(); ctx.stroke();
    const shown = asked ? '' : q;
    text(shown || 'ถามเรื่องสเปก/เงื่อนไขงาน...', fx + 24, y + 90, { w: 500, px: 26, color: shown ? INK : '#aeb6c8' });
    if (typing && blink(t)) { ctx.fillStyle = BLUE; ctx.fillRect(fx + 26 + measure(shown, 500, 26), y + 58, 3, 42); }
    const press = pressAt(t, a + 4.3);
    button('ถาม', fx + fw - 60, y + 80, 120, 80, { press, px: 28 });
    tap(fx + fw - 60, y + 80, t, a + 4.2);
    const hu = seg(t, a + 8.0, a + 8.6, outBack);
    if (hu > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(hu, 0, 1); ctx.translate(box.x + box.w / 2, box.y + box.h - 60); ctx.scale(hu, hu);
      pill('💬 เรื่องส่วนตัว แชตผ่าน สอบถามรายละเอียด ก็ได้', 0, -36, { align: 'center', px: 26, bg: INK, color: '#fff' });
      ctx.restore();
    }
  });
  dots(2, STEPS);
  ctx.restore();
}

/* 4 — the quote modal: a price, a note, the files, send. */
function scene4(t) {
  const [a, b] = T.s4;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(4, 'เสนอราคา| พร้อมแนบเอกสาร', 'ใส่ราคา เขียนเงื่อนไข แนบใบเสนอราคา แคตตาล็อก หรือตัวอย่างงาน แล้วส่ง', t, a + .1);
  const pu = seg(t, a + .3, a + 1.0);
  body(() => {
    ctx.globalAlpha *= pu;
    const box = phone(30, 30 + lerp(120, 0, pu), 800, 1180);
    // the detail page dimmed behind the modal
    ctx.save(); rr(box.x, box.y, box.w, box.h, 0); ctx.clip();
    text(ITEM, box.x + 36, box.y + 80, { w: 700, px: 34, color: '#c3c8d6' });
    ctx.fillStyle = 'rgba(15,23,42,.45)'; ctx.fillRect(box.x, box.y, box.w, box.h);
    ctx.restore();
    const mu = seg(t, a + .6, a + 1.2, outBack);
    const mx = box.x + 24, my = box.y + 24 + lerp(60, 0, clamp(mu, 0, 1)), mw = box.w - 48, mh = box.h - 48;
    ctx.save(); ctx.globalAlpha *= clamp(mu, 0, 1);
    ctx.fillStyle = '#fff'; rr(mx, my, mw, mh, 28); ctx.fill();
    const fx = mx + 30, fw = mw - 60;
    text('เสนอราคาสำหรับงานนี้', fx, my + 62, { w: 700, px: 32 });
    text('✕', mx + mw - 40, my + 56, { w: 500, px: 30, color: INK_SOFT, align: 'center', base: 'middle' });
    const typingP = t >= a + 1.4 && t < a + 3.0;
    let y = field('ราคาที่คุณเสนอ (บาท)', fx, my + 120, fw, typed(MY_PRICE, t, a + 1.5, a + 2.6), 'ราคาที่คุณเสนอ (บาท)', { focus: typingP, caret: typingP, t });
    // the note is a taller box
    y += 44;
    text('ข้อความหรือข้อเสนอเพิ่มเติม', fx, y, { w: 600, px: 28 });
    const note = typed('รวมติดตั้งหน้างาน ส่งภายใน 7 วัน รับประกัน 1 ปี', t, a + 3.2, a + 5.4);
    const typingN = t >= a + 3.1 && t < a + 5.6;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = typingN ? BLUE : LINE; ctx.lineWidth = 3; rr(fx, y + 20, fw, 120, 18); ctx.fill(); ctx.stroke();
    text(note || 'ข้อความหรือข้อเสนอเพิ่มเติม', fx + 28, y + 76, { w: note ? 500 : 400, px: 30, color: note ? INK : '#aeb6c8' });
    if (typingN && blink(t)) { ctx.fillStyle = BLUE; ctx.fillRect(fx + 30 + measure(note, 500, 30), y + 44, 3, 44); }
    y += 170;
    // dropzone, then the files it received
    const press = pressAt(t, a + 6.3);
    ctx.save(); ctx.translate(fx + fw / 2, y + 60); ctx.scale(1 - press * .04, 1 - press * .04); ctx.translate(-(fx + fw / 2), -(y + 60));
    ctx.fillStyle = BLUE_SOFT; ctx.strokeStyle = BLUE; ctx.lineWidth = 3; ctx.setLineDash([14, 10]); rr(fx, y, fw, 120, 18); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    text('☁️', fx + fw / 2, y + 44, { px: 34, align: 'center', base: 'middle' });
    text('แนบไฟล์ (ใบเสนอราคา, ตัวอย่างงาน)', fx + fw / 2, y + 92, { w: 500, px: 25, color: BLUE, align: 'center', base: 'middle' });
    ctx.restore();
    tap(fx + fw / 2, y + 60, t, a + 6.2);
    y += 140;
    FILES.forEach((f, i) => {
      const u = seg(t, a + 6.9 + i * .35, a + 7.4 + i * .35, outBack);
      if (u <= 0) return;
      const fy = y + i * 70;
      ctx.save(); ctx.globalAlpha *= clamp(u, 0, 1); ctx.translate(lerp(40, 0, clamp(u, 0, 1)), 0);
      ctx.fillStyle = '#f6f8fc'; rr(fx, fy, fw, 60, 14); ctx.fill();
      text(f[0], fx + 22, fy + 32, { px: 26, base: 'middle' });
      text(f[1], fx + 66, fy + 32, { w: 600, px: 25, base: 'middle' });
      text(f[2] + '   ✕', fx + fw - 22, fy + 32, { w: 400, px: 22, color: INK_SOFT, align: 'right', base: 'middle' });
      ctx.restore();
    });
    y += FILES.length * 70 + 30;
    const bpress = pressAt(t, a + 9.4);
    button('ส่งข้อเสนอ', fx + fw / 2, y + 50, fw, 96, { press: bpress, px: 34 });
    tap(fx + fw / 2, y + 50, t, a + 9.3);
    ctx.restore();
    // sent
    const ku = seg(t, a + 9.8, a + 10.8, u => clamp(u, 0, 1));
    if (ku > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(ku * 3, 0, 1);
      ctx.fillStyle = BG; rr(box.x, box.y, box.w, box.h, 0); ctx.fill();
      const cy = box.y + box.h / 2 - 140;
      ctx.fillStyle = GREEN_SOFT; ctx.beginPath(); ctx.arc(box.x + box.w / 2, cy, 130, 0, Math.PI * 2); ctx.fill();
      check(box.x + box.w / 2, cy, 90, ku, GREEN, 16);
      const su = seg(t, a + 10.6, a + 11.2);
      text('ส่งข้อเสนอแล้ว', box.x + box.w / 2, cy + 240, { w: 700, px: 46, align: 'center', alpha: su });
      text('฿' + MY_PRICE + ' · แนบ ' + FILES.length + ' ไฟล์', box.x + box.w / 2, cy + 300, { w: 400, px: 28, color: INK_SOFT, align: 'center', alpha: su });
      const hu = seg(t, a + 11.2, a + 11.8, outBack);
      if (hu > 0) {
        ctx.save(); ctx.globalAlpha *= clamp(hu, 0, 1); ctx.translate(box.x + box.w / 2, cy + 420); ctx.scale(hu, hu);
        pill('🔒 ผู้ขายรายอื่นมองไม่เห็นราคาของคุณ', 0, -36, { align: 'center', px: 27, bg: INK, color: '#fff' });
        ctx.restore();
      }
      ctx.restore();
    }
  });
  dots(3, STEPS);
  ctx.restore();
}

/* 5 — ใบเสนอราคา ที่ส่ง: everything you ever quoted, to whom, for how much. */
function scene5(t) {
  const [a, b] = T.s5;
  paper();
  ctx.save(); ctx.globalAlpha = fadeInOut(t, a, b, .4);
  topBrand(false);
  stepHeader(5, 'ย้อนดูได้| ว่าเสนออะไรให้ใคร', 'หน้า ใบเสนอราคา รวมทุกใบที่คุณเคยส่ง พร้อมราคา ไฟล์แนบ และสถานะ', t, a + .1);
  body(() => {
    const hu = seg(t, a + .3, a + .8);
    ctx.save(); ctx.globalAlpha *= hu;
    text('🧾 ใบเสนอราคา', 0, 50, { w: 700, px: 44 });
    text('ใบเสนอราคาทั้งหมดที่คุณเป็นผู้เสนอไปยังโพสต์ของผู้อื่น', 0, 98, { w: 400, px: 25, color: INK_SOFT });
    ctx.restore();
    const rowH = 260, gap = 24, top = 150;
    SENT.forEach((s, i) => {
      const u = seg(t, a + .9 + i * .5, a + 1.5 + i * .5);
      if (u <= 0) return;
      const y = top + i * (rowH + gap) + lerp(40, 0, u);
      const hl = i === 0 ? seg(t, a + 2.6, a + 3.1) : 0;
      ctx.save(); ctx.globalAlpha *= u;
      card(0, y, BODY_W, rowH, 26);
      if (hl > 0) { ctx.save(); ctx.globalAlpha *= hl; ctx.strokeStyle = BLUE; ctx.lineWidth = 5; rr(0, y, BODY_W, rowH, 26); ctx.stroke(); ctx.restore(); }
      thumb(28, y + 28, 130, 130);
      text(s.title, 184, y + 66, { w: 700, px: 29 });
      avatar(198, y + 108, 15, s.buyer.replace(/^(บจก\. |หจก\. )/, '').charAt(0), BLUE, '#fff');
      text('ผู้ซื้อ: ' + s.buyer, 222, y + 116, { w: 400, px: 23, color: INK_SOFT });
      text('📍 ' + s.prov + '  |  🕗 ' + s.on, 184, y + 158, { w: 400, px: 22, color: INK_SOFT });
      pill('📎 ' + s.files + ' ไฟล์', 184, y + 184, { px: 21, h: 38, padX: 14, bg: '#f1f3f8', color: INK_SOFT });
      text('ราคาที่เสนอ', BODY_W - 34, y + 60, { w: 400, px: 21, color: INK_SOFT, align: 'right' });
      text(s.price, BODY_W - 34, y + 110, { w: 700, px: 42, align: 'right' });
      pill(s.open ? 'ส่งแล้ว' : 'ปิดรับแล้ว', BODY_W - 34, y + 140, { align: 'right', px: 21, h: 40, padX: 16, bg: s.open ? BLUE_SOFT : '#f1f3f8', color: s.open ? BLUE : INK_SOFT });
      text('ปิดรับข้อเสนอ ' + s.until, BODY_W - 34, y + 218, { w: 400, px: 21, color: '#8a90a3', align: 'right' });
      ctx.restore();
    });
    const su = seg(t, a + 4.6, a + 5.2, outBack);
    if (su > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(su, 0, 1); ctx.translate(BODY_W / 2, 1080); ctx.scale(su, su);
      ctx.fillStyle = BLUE; rr(-410, -60, 820, 120, 36); ctx.fill();
      text('กดที่แถวเพื่อกลับไปดูประกาศนั้นอีกครั้ง', 0, 4, { w: 700, px: 32, color: '#fff', align: 'center', base: 'middle' });
      ctx.restore();
    }
  });
  dots(4, STEPS);
  ctx.restore();
}

function sceneOutro(t) {
  const [a, b] = T.outro;
  blueGround(t);
  ctx.save(); ctx.globalAlpha = Math.min(seg(t, a, a + .5), 1 - seg(t, b - .6, b, u => clamp(u, 0, 1)));
  let P;
  if (F.kind === 'portrait')    P = { my: 760, mh: 260, wy: 1010, wpx: 120, sy: 1150, spx: 58, py: 1290, ppx: 44, ny: 1470, npx: 32 };
  else if (F.kind === 'square') P = { my: 300, mh: 200, wy: 500, wpx: 104, sy: 615, spx: 50, py: 720, ppx: 40, ny: 870, npx: 30 };
  else                          P = { my: 270, mh: 220, wy: 500, wpx: 120, sy: 640, spx: 58, py: 760, ppx: 44, ny: 930, npx: 32 };
  const u = seg(t, a + .1, a + .9, outBack);
  ctx.save(); ctx.translate(W / 2, P.my); ctx.scale(u, u);
  const im = IMG.markWhite; const mw = P.mh * im.width / im.height;
  ctx.drawImage(im, -mw / 2, -P.mh / 2, mw, P.mh);
  ctx.restore();
  const wu = seg(t, a + .6, a + 1.2);
  ctx.save(); ctx.globalAlpha *= wu;
  wordmark(W / 2 - wordmarkWidth(P.wpx) / 2, P.wy, P.wpx, true);
  ctx.restore();
  const su = seg(t, a + 1.1, a + 1.7);
  text('ผู้ซื้อกำลังมองหาคุณอยู่', W / 2, P.sy + lerp(30, 0, su), { w: 600, px: P.spx, color: '#fff', align: 'center', alpha: su });
  pill('qubequote.com', W / 2, P.py, { align: 'center', px: P.ppx, padX: 48, bg: '#fff', color: BLUE, alpha: seg(t, a + 1.7, a + 2.3) });
  text('ดูประกาศได้ทันที · สมัครฟรีเมื่อพร้อมเสนอราคา', W / 2, P.ny, { w: 400, px: P.npx, color: 'rgba(255,255,255,.85)', align: 'center', alpha: seg(t, a + 2.2, a + 2.8) });
  ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  if (t < T.hook[1]) sceneHook(t);
  else if (t < T.s1[1]) scene1(t);
  else if (t < T.s2[1]) scene2(t);
  else if (t < T.s3[1]) scene3(t);
  else if (t < T.s4[1]) scene4(t);
  else if (t < T.s5[1]) scene5(t);
  else sceneOutro(Math.min(t, DURATION - 1e-3));
}

boot();
</script>
