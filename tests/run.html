<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konnex — เทสต์</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --line:#e6e9f0; --ink:#1c1a18; --soft:#565b6e;
    --ok:#15803d; --ok-bg:#eaf7ee; --bad:#c0392b; --bad-bg:#fdeceb; --blue:#0a5bff;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans Thai","Segoe UI",system-ui,sans-serif; font-size:15px;
  }
  header{
    position:sticky; top:0; z-index:2; background:var(--card);
    border-bottom:1px solid var(--line); padding:16px 22px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  h1{ font-size:18px; font-weight:600; margin:0; }
  .totals{ display:flex; gap:8px; margin-left:auto; }
  .pill{ border-radius:999px; padding:4px 13px; font-size:14px; font-weight:600; }
  .pill.ok{ background:var(--ok-bg); color:var(--ok); }
  .pill.bad{ background:var(--bad-bg); color:var(--bad); }
  .pill.run{ background:#eef2ff; color:var(--blue); }
  main{ padding:20px 22px 60px; max-width:1000px; }
  .suite{ background:var(--card); border:1px solid var(--line); border-radius:12px;
          margin-bottom:14px; overflow:hidden; }
  .suite > h2{ font-size:15px; font-weight:600; margin:0; padding:13px 18px;
               border-bottom:1px solid var(--line); background:#fbfcfe; }
  .t{ display:flex; gap:11px; padding:9px 18px; border-bottom:1px solid #f2f4f8;
      align-items:flex-start; font-size:14px; line-height:1.6; }
  .t:last-child{ border-bottom:none; }
  .mark{ flex:none; width:18px; font-weight:700; }
  .t.ok .mark{ color:var(--ok); }
  .t.bad{ background:var(--bad-bg); }
  .t.bad .mark{ color:var(--bad); }
  pre{ margin:6px 0 0; font-size:12.5px; color:var(--bad); white-space:pre-wrap;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  #app{ width:1280px; height:900px; border:0; position:fixed; left:-4000px; top:0; }
  .note{ color:var(--soft); font-size:13.5px; line-height:1.7; margin:0 0 16px; }
</style>
</head>
<body>
<header>
  <h1>Konnex — เทสต์</h1>
  <span class="totals" id="totals"><span class="pill run">กำลังโหลดแอป…</span></span>
</header>
<main>
  <p class="note">
    แต่ละเทสต์เรียกฟังก์ชันจริงในหน้า <code>index.html</code> ที่โหลดไว้ใน iframe
    โดยแทนที่ตัวเชื่อมฐานข้อมูลด้วยของปลอมที่บันทึกทุกการเขียน — ไม่มีการแตะข้อมูลจริง
  </p>
  <div id="out"></div>
</main>

<iframe id="app" src="../index.html?test=1"></iframe>

<script src="harness.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var totals = document.getElementById('totals');
  var groups = {};

  function paint(groupName, rec) {
    var g = groups[groupName];
    if (!g) {
      g = document.createElement('section');
      g.className = 'suite';
      g.innerHTML = '<h2></h2>';
      g.querySelector('h2').textContent = groupName;
      out.appendChild(g);
      groups[groupName] = g;
    }
    var row = document.createElement('div');
    row.className = 't ' + (rec.ok ? 'ok' : 'bad');
    var mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = rec.ok ? '✔' : '✕';
    var body = document.createElement('span');
    body.textContent = rec.name;
    row.appendChild(mark); row.appendChild(body);
    if (!rec.ok) {
      var pre = document.createElement('pre');
      pre.textContent = rec.err;
      body.appendChild(pre);
    }
    g.appendChild(row);
  }

  var frame = document.getElementById('app');
  frame.addEventListener('load', function () {
    var w = frame.contentWindow;
    // the app boots asynchronously (session check, first paint) — give it a beat
    setTimeout(async function () {
      // keep the real client so a test can put it back, then stop the app from
      // reaching the network on its own while the suite runs
      w.__realSb = w.sb;
      if (w.kxChatPollStop) w.kxChatPollStop();

      var s = document.createElement('script');
      s.src = 'suite.js';
      s.onload = async function () {
        /* ?only=<ข้อความ> รันเฉพาะกลุ่มที่ชื่อมีข้อความนั้น — the full run walks
           every page in the app, and each one waits out its own network calls,
           so a whole pass is minutes long. When you are iterating on one group
           that wait tells you nothing. */
        var only = (location.search.match(/[?&]only=([^&]*)/) || [])[1];
        if (only) {
          only = decodeURIComponent(only).toLowerCase();
          var keep = KX.suites.filter(function (g) {
            return g.name.toLowerCase().indexOf(only) > -1;
          });
          KX.suites.length = 0;
          keep.forEach(function (g) { KX.suites.push(g); });
        }
        totals.innerHTML = '<span class="pill run">กำลังรัน…' +
          (only ? ' (เฉพาะ “' + only + '”)' : '') + '</span>';
        var r = await KX.run(w, paint);
        totals.innerHTML =
          '<span class="pill ok">ผ่าน ' + r.passed + '</span>' +
          (r.failed ? '<span class="pill bad">ไม่ผ่าน ' + r.failed + '</span>'
                    : '<span class="pill ok">ครบทุกข้อ</span>');
        document.title = (r.failed ? '✕ ' + r.failed + ' ล้ม — ' : '✔ ') + 'Konnex เทสต์';
        window.__kxTestResult = r;      // for a scripted run
      };
      document.body.appendChild(s);
    }, 900);
  });
})();
</script>
</body>
</html>
