# QubeQuote is still a browser-only app — Supabase is called directly from the page.
# The one thing that cannot be done in the browser is the card a shared listing
# shows in Facebook or LINE: the app routes on the URL fragment, and a fragment
# never reaches a server, so every crawler asked for `/` and got the same
# site-wide card for every listing. worker/index.js answers `/p/<id>` with that
# listing's own title, photo and description, and hands everything else to the
# static assets untouched.
#
# The public address is https://qubequote.com, attached to this Worker as a custom
# domain in the Cloudflare dashboard (Workers & Pages → this worker → Domains &
# Routes). It is deliberately not a `routes` entry here: the dashboard creates the
# DNS record and the certificate with it, and a route in this file that does not
# match the zone fails the build instead of the request.
#
# `name` is deliberately still `konnex`. It is the Worker's identity, not the
# site's address — changing it renames nothing, it deploys a second, empty-history
# Worker and leaves the old one serving the old build. konnex.xeeb0262.workers.dev
# keeps working alongside the custom domain; both reach this same Worker.
name = "konnex"
compatibility_date = "2026-01-01"
main = "worker/index.js"

[assets]
directory = "./"
# the binding the Worker falls through to; without it env.ASSETS is undefined
# and every request that is not /p/<id> answers with an error
binding = "ASSETS"
