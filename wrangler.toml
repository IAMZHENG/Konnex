# QubeQuote has no server-side code — Supabase is called directly from the browser —
# so this deploys as a Worker that serves static assets only, no Worker script needed.
#
# `name` is deliberately still `konnex`: it is the Worker's identity, and it is what
# puts the site at konnex.xeeb0262.workers.dev. Changing it here does not rename
# anything — it deploys a second, empty-history Worker at a new hostname and leaves
# the old one serving the old build at the old address. Moving the site to a
# qubequote address is a deploy decision, not a find-and-replace.
name = "konnex"
compatibility_date = "2026-01-01"

[assets]
directory = "./"
