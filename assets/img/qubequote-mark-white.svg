<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 260" width="230" height="260" role="img" aria-label="QubeQuote">
  <title>QubeQuote</title>
  <!--
    Traced off the brand sheet, then regularised — not redrawn by eye and not
    left as raw trace either.

    The raw trace followed the artwork to 99.9%, but it followed its raster
    wobble too: every "straight" edge was a chain of short segments a fraction
    of a pixel off true, and every corner was a polygon pretending to be an
    arc. So each long run of the traced outline is fitted to a line whose
    angle is snapped to the hexagonal set the mark is built on — vertical, or
    30 degrees off horizontal, nothing else — consecutive lines are
    intersected for the true corner, and a circular fillet is dropped in.
    Twelve edges for the ring, four for the tail, which is exactly what the
    shape has.

    The corners are then rounded harder than the sheet draws them, which is a
    deliberate difference and the reason this sits at ~97.7% of the original
    rather than 99.9%. One radius across the ring (18) and a smaller one for
    the tail (11): the tail is about a third the size, so a single radius made
    it a lozenge instead of a slanted bar. Each fillet is capped at 45% of
    either edge it sits between, so no short edge is ever swallowed.
  -->
  <!-- White on transparent: the sign-in page's blue panel. -->
