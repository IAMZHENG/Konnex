<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.23 0.49 221.52 245.19" width="221.52" height="245.19" role="img" aria-label="QubeQuote">
  <title>QubeQuote</title>
  <!--
    Traced off the brand sheet, then regularised: every long run of the traced
    outline is fitted to a line whose angle is snapped to the hexagonal set the
    mark is built on — vertical, or 30 degrees off horizontal, nothing else —
    consecutive lines are intersected for the true corner, and a circular
    fillet is dropped in. Twelve edges for the ring, four for the tail.

    Corner radii, in the units of this viewBox (band width 46):
      ring, hexagon corners  9
      ring, the two cut ends 5.5
      tail                   5.5

    The tail is moved 7.5 left and 13 up from where the sheet draws it. The
    two gaps between it and the ring sat at 19.5 — 42% of the band, which read
    as too far apart. They are 12 now. The move is along the hexagon's own
    diagonal because the two gaps face 60 degrees apart, and that is the one
    direction that closes both by the same amount.

    The viewBox is fitted to the ink rather than left at 230x260: moving the
    tail inward shrank the drawing, and a box with slack on two sides makes
    every `object-fit: contain` in the app render the mark small and off
    centre.
  -->
  <!-- White on transparent: the sign-in page's blue panel. -->
