<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 260" width="230" height="260" role="img" aria-label="QubeQuote">
  <title>QubeQuote</title>
  <!--
    Traced off the brand sheet, then regularised — not redrawn by eye, and not
    left as raw trace either. Each long run of the traced outline is fitted to
    a line whose angle is snapped to the hexagonal set the mark is built on —
    vertical, or 30 degrees off horizontal, nothing else — consecutive lines
    are intersected for the true corner, and a circular fillet is dropped in.
    Twelve edges for the ring, four for the tail, which is what the shape has.

    Corner radii, in the units of this viewBox (230 x 260, band width 46):
      ring, hexagon corners  9
      ring, the two cut ends 5.5  — the ring is open at the lower right, and
                                    the four corners belonging to those two
                                    cuts are tighter than the hexagon's own
      tail                   5.5  — a third the size of the ring, so one
                                    radius across both made it a lozenge
    Each fillet is capped at 45% of either edge it sits between, so a short
    edge can never be swallowed and the outline can never go wavy again.
  -->
  <!-- White on transparent: the sign-in page's blue panel. -->
